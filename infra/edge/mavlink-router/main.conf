# infra/edge/mavlink-router/main.conf
#
# mavlink-router config: flight-controller UART -> UDP push to this
# platform. Install at /etc/mavlink-router/main.conf on the companion
# computer (mavlink-router's default config path) and edit the two
# CHANGE-ME values below for your setup.
#
# Syntax verified against mavlink-router's own examples/config.sample and
# ArduPilot's own published companion-computer reference config
# (github.com/ArduPilot/companion, Common/Ubuntu/mavlink-router/
# mavlink-router.conf) -- both confirm the [UartEndpoint <name>]
# Device=/Baud= and [UdpEndpoint <name>] Mode=/Address=/Port= keys used here.

[General]
MavlinkDialect = ardupilotmega

[UartEndpoint fc]
# CHANGE ME: the UART wired to the flight controller's telemetry port.
# /dev/ttyAMA0 is the RPi's primary UART (GPIO14/15) when Bluetooth is
# disabled or moved off it (see companion-rpi.md "Wiring" section) --
# /dev/ttyUSB0 if bridging over a USB-serial adapter instead.
Device = /dev/ttyAMA0
Baud = 57600

[UdpEndpoint platform]
# CHANGE ME: this platform's reachable host/IP. Mode=Normal means
# mavlink-router actively pushes here (a UDP *client*, matching this
# platform's listen-not-connect ingest model -- adapter-mavlink/MODULE.md).
Mode = Normal
Address = platform.example.internal
Port = 14550
