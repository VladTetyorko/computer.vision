# infra/sitl/docker-compose.yml
#
# Single-instance template for the ArduPilot SITL image (see Dockerfile) --
# directly runnable for the "one instance, CI-style smoke test" case:
#
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# For N>1 real vehicles, use ./up.sh N / ./down.sh instead (docs/DRONE-
# INFRA-PLAN.md I-c): plain `docker compose --scale` gives every replica
# identical environment variables, which cannot produce N *distinct*
# SYSID_THISMAV values -- distinct sysids are the entire point of a fleet,
# so up.sh fans out N `docker run`s off this same image instead. This file
# stays the single source of truth for the image/defaults either way.
services:
  sitl:
    build: .
    image: vision-sitl:4.7.0
    container_name: vision-sitl-1
    environment:
      # copter (default) | rover -- one image carries both ArduPilot binaries,
      # see Dockerfile (docs/plans/active/FLEET-RADIO-PLAN.md R7).
      VEHICLE: "${VEHICLE:-copter}"
      SYSID_THISMAV: "${SYSID_THISMAV:-1}"
      INSTANCE: "${INSTANCE:-0}"
      # host.docker.internal: the docker host itself -- this platform LISTENS
      # on UDP (adapter-mavlink/MODULE.md, "udp://host:port means listen, not
      # connect"), so SITL must push *to* it, never the reverse.
      MAVLINK_TARGET_HOST: "${MAVLINK_TARGET_HOST:-host.docker.internal}"
      MAVLINK_TARGET_PORT: "${MAVLINK_TARGET_PORT:-14550}"
      SITL_HOME: "${SITL_HOME:--35.363261,149.165230,584,353}"
      SITL_SPEEDUP: "${SITL_SPEEDUP:-1}"
      TAKEOFF_ALT_M: "${TAKEOFF_ALT_M:-20}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      - "vision.sitl.fleet=true"

  # A rover on the SAME UDP port as the copter above, under a distinct sysid.
  # Not started by default -- `docker compose --profile rover up -d` -- so the
  # single-vehicle smoke case is byte-identical to what it was before R7.
  #
  # One port, two vehicles of different kinds is not incidental: it is the
  # FLEET-RADIO exit gate itself (§6). Per-peer drop rate (R4), the rover's own
  # mode table rather than the copter's (R1) and "an unidentified vehicle
  # cannot be engaged" (R2) are all claims that only mean anything when a
  # second, differently-shaped vehicle is on the wire.
  #
  # INSTANCE 1, not 0: SITL offsets every local port by 10*instance, so two
  # containers at instance 0 would both bind the same simulation ports.
  rover:
    build: .
    image: vision-sitl:4.7.0
    container_name: vision-sitl-rover-1
    profiles: ["rover"]
    environment:
      VEHICLE: "rover"
      SYSID_THISMAV: "${ROVER_SYSID:-2}"
      INSTANCE: "${ROVER_INSTANCE:-1}"
      MAVLINK_TARGET_HOST: "${MAVLINK_TARGET_HOST:-host.docker.internal}"
      MAVLINK_TARGET_PORT: "${MAVLINK_TARGET_PORT:-14550}"
      SITL_HOME: "${SITL_HOME:--35.363261,149.165230,584,353}"
      SITL_SPEEDUP: "${SITL_SPEEDUP:-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      - "vision.sitl.fleet=true"
