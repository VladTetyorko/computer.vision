<div class="bell">
  <button
    type="button"
    class="bell-trigger"
    #trigger
    aria-label="Notifications"
    aria-haspopup="true"
    [attr.aria-expanded]="overlays.isOpen('notification-bell')"
    [title]="unreadCount() > 0 ? unreadCount() + ' unread event' + (unreadCount() === 1 ? '' : 's') : 'Notifications'"
    (click)="toggleBell()"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6" />
      <path d="M10 20a2 2 0 0 0 4 0" />
    </svg>
    @if (unreadCount() > 0) {
      <span class="bell-badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
  </button>

  @if (overlays.isOpen('notification-bell')) {
    <div class="bell-dropdown">
      <vision-events-rail (open)="onRailOpen($event)" />

      <!-- System events (docs/plans/active/SYSTEM-STATUS-PLAN.md §3.2-§3.3) — a durable home for the seven
           generic LiveEvent kinds (everything but DETECTION, which already has the card above). Same
           card shape as the detections card so the two read as one family, not two competing feeds. -->
      <aside class="card system-events">
        <header>
          <h3>System</h3>
          <span class="muted">{{ systemEvents.rows().length }}</span>
        </header>
        @if (systemEvents.rows().length === 0) {
          <p class="muted hint">No system events yet.</p>
        } @else {
          <ul class="event-list">
            @for (row of systemEvents.rows(); track row.id) {
              <li>
                <vision-system-event-row
                  [event]="row"
                  [sourceLabel]="systemEventSource(row)"
                  [relativeTime]="systemEventRelativeTime(row)"
                />
              </li>
            }
          </ul>
        }
      </aside>
    </div>
  }
</div>
