<div class="bell">
  <button
    type="button"
    class="bell-trigger"
    #trigger
    aria-label="Notifications"
    aria-haspopup="true"
    [attr.aria-expanded]="overlays.isOpen('notification-bell')"
    [title]="unreadCount() > 0 ? unreadCount() + ' unread event' + (unreadCount() === 1 ? '' : 's') : 'Notifications'"
    (click)="toggleBell()"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6" />
      <path d="M10 20a2 2 0 0 0 4 0" />
    </svg>
    @if (unreadCount() > 0) {
      <span class="bell-badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
  </button>

  @if (overlays.isOpen('notification-bell')) {
    <vision-events-rail class="bell-dropdown" (open)="onRailOpen($event)" />
  }
</div>
