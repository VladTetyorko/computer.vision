<nav class="rail" aria-label="Setup steps">
  <ol class="rail-list">
    @for (item of items(); track item.id; let i = $index) {
      <li>
        <button
          type="button"
          class="rail-step"
          [class.done]="item.done"
          [class.current]="i === currentIndex()"
          [attr.aria-current]="i === currentIndex() ? 'step' : null"
          (click)="jump.emit(i)"
        >
          <span class="rail-glyph">
            @if (item.done) {
              <vision-icon name="check" [size]="14" />
            } @else {
              <span class="rail-dot"></span>
            }
          </span>
          <span class="rail-title">{{ item.label }}</span>
        </button>
      </li>
    }
  </ol>
</nav>
