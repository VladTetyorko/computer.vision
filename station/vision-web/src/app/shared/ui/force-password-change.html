@if (auth.mustChangePassword()) {
  <div class="backdrop">
    <form class="dialog card" role="alertdialog" aria-modal="true" (submit)="$event.preventDefault(); submit()">
      <h2>Change your password</h2>
      <p class="muted">
        Your password was set by someone else. Choose a new one before continuing — it must be
        different from a temporary or reset password nobody else should know.
      </p>

      <label class="field">
        <span class="label">Current password</span>
        <input
          type="password"
          name="currentPassword"
          autocomplete="current-password"
          [value]="currentPassword()"
          (input)="currentPassword.set($any($event.target).value)"
          [disabled]="busy()"
          required
        />
      </label>

      <label class="field">
        <span class="label">New password</span>
        <input
          type="password"
          name="newPassword"
          autocomplete="new-password"
          [value]="newPassword()"
          (input)="newPassword.set($any($event.target).value)"
          [disabled]="busy()"
          required
        />
      </label>

      <label class="field">
        <span class="label">Confirm new password</span>
        <input
          type="password"
          name="confirmPassword"
          autocomplete="new-password"
          [value]="confirmPassword()"
          (input)="confirmPassword.set($any($event.target).value)"
          [disabled]="busy()"
          required
        />
        @if (newPassword() && confirmPassword() && !passwordsMatch()) {
          <span class="field-hint">Passwords don't match.</span>
        }
      </label>

      @if (error(); as message) {
        <vision-notice variant="danger">{{ message }}</vision-notice>
      }

      <div class="dialog-actions">
        <button type="button" class="btn secondary" (click)="logout()" [disabled]="busy()">Log out instead</button>
        <button type="submit" class="btn force-submit" [disabled]="!canSubmit()">
          {{ busy() ? 'Changing…' : 'Change password' }}
        </button>
      </div>
    </form>
  </div>
}
