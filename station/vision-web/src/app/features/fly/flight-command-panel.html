@if (canCommand()) {
  @if (capabilities(); as caps) {
    @if (caps.armSupported) {
      <!-- One wrapper around the pill row + its own disable-reason line (docs/plans/active/
           FLY-CONTROL-UX-PLAN.md §3) — `fly-hud.css` positions *this* box in the HUD's bottom-right
           zone; without it the two would be two independent top-level siblings (this component's own
           `:host { display: contents }`) with nothing to anchor a shared position to. -->
      <div class="hud-arm-zone">
        <div class="command-row command-row-danger">
          <button
            type="button"
            class="btn danger arm-btn hud-pill"
            [class.locked]="armDisabled()"
            (click)="requestArm()"
            [disabled]="armBusy() || armDisabled()"
            [title]="composedArmReason() ?? 'Arm — the propellers will spin'"
          >
            @if (armDisabled()) {
              <vision-icon name="alert" [size]="14" />
            }
            Arm
          </button>
          <button
            type="button"
            class="btn danger hud-pill"
            (click)="requestDisarm()"
            [disabled]="disarmBusy()"
            title="Disarm"
          >
            Disarm
          </button>
          @if (armAlsoOn(); as hint) {
            <span class="also-on muted">also on {{ hint }}</span>
          }
        </div>
        @if (composedArmReason(); as reason) {
          <p class="disabled-reason">{{ reason }}</p>
        }
      </div>
    }
  }

  @if (isDialogOpen('disarm')) {
    <vision-confirm-dialog
      [message]="disarmMessage()"
      confirmLabel="Disarm"
      cancelLabel="Cancel"
      [busy]="disarmBusy()"
      (confirmed)="confirmDisarm()"
      (cancelled)="cancelDisarm()"
    />
  }

  @if (isDialogOpen('arm')) {
    <vision-arm-confirm-dialog
      [assetDisplayName]="assetDisplayName()"
      [busy]="armBusy()"
      [sticksNotNeutralReason]="sticksNotNeutralReason()"
      (confirmed)="confirmArm()"
      (cancelled)="cancelArm()"
    />
  }
}
