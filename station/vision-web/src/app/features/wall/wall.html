<!-- `.surface-dark` (docs/plans/done/VISUAL-REFRESH-PLAN.md F3/W4) on this page's own root — the Wall
     is genuinely a video surface end to end: the grid, the bar, the focus layer and (wave W4) the
     activity drawer are all part of the same "watching a wall of live feeds" picture. -->
<div class="page surface-dark">
  <!-- L1 — the one 40px frame: title + live count + density + one declutter control + Activity(n)
       (WALL-FLOW-PLAN.md §3.4). No `[pageBarFilters]`/`[pageBarActions]` at all with zero tiles —
       there is nothing to filter or act on in the P0 empty state. -->
  <vision-page-bar title="Wall" icon="grid" [count]="facade.liveCount()" countNoun="stream">
    @if (facade.liveCount() > 0) {
      <div pageBarFilters class="row bar-controls">
        <div class="segmented" role="group" aria-label="Tile density">
          @for (stop of densityStops; track stop.value) {
            <button
              type="button"
              class="btn secondary small"
              [class.active]="facade.density() === stop.value"
              (click)="facade.setDensity(stop.value)"
            >
              {{ stop.label }}
            </button>
          }
        </div>
        <button
          type="button"
          class="btn secondary small"
          (click)="facade.cycleBoxesMode()"
          [title]="'Detection boxes: ' + declutterLevelLabel(facade.boxesMode()) + ' — click to change'"
        >
          Boxes: {{ declutterLevelLabel(facade.boxesMode()) }}
        </button>
      </div>
    }
    @if (facade.liveCount() > 0) {
      <div pageBarActions>
        <button
          type="button"
          class="btn secondary small"
          (click)="facade.toggleActivity()"
          [class.active]="facade.activityOpen()"
          [attr.aria-expanded]="facade.activityOpen()"
        >
          Activity ({{ facade.activityCount() }})
        </button>
      </div>
    }
  </vision-page-bar>

  @if (facade.liveCount() === 0) {
    <!-- P0 — full width, no rail stealing the column (D21). -->
    <div class="empty-wrap">
      <vision-empty
        title="Nothing is streaming"
        message="Start a stream from Inventory and it appears here. With no hardware to hand, the simulated source works end to end."
      >
        <a class="btn" routerLink="/assets">Go to Inventory</a>
      </vision-empty>
    </div>
  } @else {
    <!-- P1 — the grid IS the page. `--tile-min` drives `repeat(auto-fill, minmax(…))`, so the
         window reflows tiles with no control touched (D11). Stable order (never attention-sorted,
         §3's frozen decision) — `buildWallTiles` already sorted `facade.tiles()`, so `@for` just
         renders it. -->
    <div class="grid" [style.--tile-min.px]="facade.tileMinPx()">
      @for (tile of facade.tiles(); track tile.streamId) {
        <vision-wall-tile [tile]="tile" [boxesMode]="facade.boxesMode()" (focused)="facade.focus($event)" />
      }
    </div>
  }

  <!-- P2 — L3 focus layer, over the wall, never a navigation (§3 law 2). -->
  @if (facade.focusedTile(); as tile) {
    <vision-wall-focus
      [tile]="tile"
      [boxesMode]="facade.boxesMode()"
      (closed)="facade.clearFocus()"
      (openCockpit)="onOpenCockpit($event)"
      (watchLive)="onWatchLive($event)"
    />
  }
</div>
