<button
  type="button"
  class="tile"
  [class.severity-warning]="tile().severity === 'warning'"
  [class.severity-critical]="tile().severity === 'critical'"
  [class.pulsing]="tile().pulse !== null"
  [attr.aria-label]="'Focus ' + tile().title"
  [title]="reasonsTooltip() || null"
  (click)="onActivate()"
>
  @if (videoUp()) {
    <vision-player
      [src]="tile().viewUrl ?? null"
      [whepUrl]="tile().whepUrl ?? null"
      [suspended]="!visible()"
      [compact]="true"
      [detections]="detections.results()"
      [boxesMode]="boxesMode()"
      [lockedTrackId]="lockedTrackId()"
      [cropFollowEnabled]="cropFollowEnabled()"
    />
  } @else {
    <!-- State-only default (§4 Wave C1/C2) — no player instance at all, not merely a suspended one
         (see wall-tile.ts's own "Video is opt-in" doc section for why). The identity/severity/pulse/
         detail chrome below renders exactly the same either way; only the picture itself is absent.
         `.surface-dark` mirrors `<vision-player>`'s own `.frame` (`player.ts`'s doc comment) — a
         video-off tile should still read as a dark "no signal" slot, not a theme-light empty box. -->
    <div class="placeholder surface-dark">
      <vision-icon name="eye-off" [size]="20" />
    </div>
  }

  @if (tile().severity !== 'ok') {
    <span
      class="dot severity-dot"
      [class.warn]="tile().severity === 'warning'"
      [class.danger]="tile().severity === 'critical'"
    ></span>
  }

  @if (tile().pulse; as pulse) {
    <span class="chip pulse-chip">
      <span class="dot live"></span>
      <span class="pulse-label truncate">{{ pulse.label }}</span>
      @if (pulse.count > 1) {
        <span class="mono">&times;{{ pulse.count }}</span>
      }
    </span>
  }

  <footer class="identity">
    <span class="name truncate">{{ tile().title }}</span>
    @if (tile().healthLabel; as label) {
      <span class="health-line truncate">{{ label }}</span>
    }
  </footer>

  <div class="detail">
    @if (tile().unlinked) {
      <span class="muted truncate">Not linked to an asset</span>
    }
    @if (tile().batteryLabel; as label) {
      <span
        class="chip battery-chip"
        [class.warn]="tile().batterySeverity === 'warning'"
        [class.danger]="tile().batterySeverity === 'critical'"
      >
        <vision-icon name="battery" [size]="12" />{{ label }}
      </span>
    }
    @if (tile().telemetryAgeLabel; as age) {
      <span class="muted">{{ age }}</span>
    }
  </div>
</button>

<!-- ---- Video-on-request toggle (§4 Wave C1/C2) — a DOM SIBLING of `.tile` above, never a
     descendant: `.tile` is itself a `<button>`, and `vision-icon-button` renders its own `<button>`,
     which nested inside `.tile` would be invalid, click-bubbling HTML (the exact reason
     `<vision-follow-hud>` below is already a sibling). Always rendered, never hover/focus-only — the
     task's own "unmistakable per-tile affordance" requirement, and a hover-only control would be
     unreachable on a touch wall display. -->
<vision-icon-button
  class="video-toggle"
  [icon]="videoUp() ? 'eye-off' : 'eye'"
  [label]="(videoUp() ? 'Hide video — ' : 'Show video — ') + tile().title"
  [active]="videoUp()"
  variant="hud"
  (activated)="onToggleVideo()"
/>

<!-- ---- Follow, read-only (docs/plans/active/TRACK-FOLLOW-PLAN.md §3.3, wave W5; WALL-FLOW-PLAN §5
     — the Wall is a watch surface, not a control surface) — a DOM SIBLING of `.tile` above, never a
     descendant: `.tile` is itself a `<button>`, and `<vision-follow-hud>` can render its own
     `<button>` (Re-acquire), which nested inside `.tile` would be invalid, click-bubbling HTML.
     `canRelease` is hardcoded `false` and neither `(release)` nor `(reacquire)` is bound — this
     mount can never send a write, by construction, regardless of what the lock's own state is. -->
<vision-follow-hud
  [follow]="follow()"
  [canRelease]="false"
  [cropFollowEnabled]="cropFollowEnabled()"
  (cropFollowEnabledChange)="cropFollowEnabledChange.emit($event)"
/>
