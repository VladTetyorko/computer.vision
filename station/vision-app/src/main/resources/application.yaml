    #     tune: zerolatency

    # --- adapter-mjpeg tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §1.3/§2.2, Wave F1) ---
    # Every key below is commented out: each documents MjpegSettings' default rather than overriding
    # it. Maps onto MjpegVideoSource (RX) and MjpegFeedTransmitter (TX, transmit.* only).
    # mjpeg:
    #   read-timeout: 5s
    #   publisher-buffer-capacity: 4
    #   close-join-timeout: 20s
    #   transmit:
    #     bind-host: 127.0.0.1
    #     transmit.max-viewer-threads is absent by default (unbounded cached thread pool) -- there was
    #     never a literal cap to preserve, so "absent" is itself the faithful default; set e.g.
    #     max-viewer-threads: 16 to cap it.
    #     jpeg-quality: 0.75
    #     loop: true
    #     viewer-join-timeout: 5s

    # --- adapter-v4l2 tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §1.3/§2.2, Wave F1) ---
    # Every key below is commented out: each documents the default V4l2VideoSource's 2-arg constructor
    # already used, unchanged. Only two tunables exist -- adapter-v4l2 has no dedicated settings record
    # (§1.3 rule 4). default-video-size/framerate/input-format are per-device StreamDescriptor options
    # passed straight to FFmpeg's own v4l2 demuxer with no app-level default layer, so they have no
    # vision.v4l2.* property here.
    # v4l2:
    #   publisher-buffer-capacity: 4
    #   close-join-timeout: 20s

    # --- adapter-mavlink tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §1.3/§2.2, Wave F2) ---
    # Every key below is commented out: each documents MavlinkSettings' default rather than overriding
    # it. Maps onto MavlinkTelemetrySource/MavlinkFlightCommander (RX/command-TX) and
    # MavlinkFeedTransmitter (TX simulator); vision.rc.* (above) supplies the Rc slice.
    # mavlink:
    #   bind-host: 0.0.0.0
    #   silence-window: 30s
    #   max-unclaimed-vehicles: 32
    #   close-join-timeout: 5s
    #   ack-timeout: 2s
    #   MavlinkHeartbeatScanner's poll/self-bind-timeout budget.
    #   scan:
    #     active-hub-poll-count: 5
    #     active-hub-min-poll-interval: 20ms
    #     self-bind-min-read-timeout: 20ms
    #     self-bind-max-read-timeout: 200ms
    #   MavlinkFeedTransmitter's synthetic-flight cadence/defaults.
    #   transmit:
    #     tick: 50ms
    #     heartbeat-period: 1s
    #     default-speed-mps: 12.0
    #     default-position-rate-hz: 5.0
    #     default-failsafe-battery-percent: 15.0
    #     default-sysid: 1

    # --- adapter-overlay tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §1.3/§2.2, Wave F3) ---
    # Every key below is commented out: each documents OverlaySettings' default rather than overriding
    # it. Maps onto Java2DOverlayRenderer's detection-box/telemetry-OSD burn-in.
#  overlay:
#    jpeg-quality: 0.8
#    min-stroke-width: 2
#    stroke-divisor: 200
#    min-font-size: 12
#    font-divisor: 45
#    osd-background-alpha: 160
#    osd-margin: 4
