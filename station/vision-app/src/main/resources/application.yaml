# =====================================================================================
# vision -- whole-app configuration. One block per module/feature under `vision:`, so an
# IDE folds each module independently (collapse `vision:` for the whole tree).
#
# Layout: every second-level key under `vision:` is one owner -- a Maven module from
# CLAUDE.md's module index (publish -> adapter-publish-hls, cv -> adapter-cv-grpc, ...) or
# a cross-module feature (tracking, training, auth). Blocks are ordered core-first:
# egress, inference, tracking, discovery, persistence, live, simulation, auth, rc,
# training, then the per-layer/per-adapter tunables.
#
# Commented-out keys DOCUMENT a default rather than override it -- the value shown is what
# the matching Vision*Properties record already declares via @DefaultValue, so uncommenting
# one changes nothing until you edit it. Blocks whose every key is commented have their
# module key commented too, so the block stays an honest "nothing set here".
#
# Precedence, highest first: environment variables / CLI args (VISION_CV_ENABLED,
# --vision.cv.endpoint=... -- how docker-compose.yml retargets a container) > this file >
# each record's own @DefaultValue.
# =====================================================================================

spring:
  application:
    name: vision
  # threads.virtual.enabled is deliberately NOT set here, reversing
  # docs/plans/active/SCALE-100-PLAN.md §4 decision 2, which pinned it "on".
  # This project targets Java 21 (root pom java.version), where a virtual thread
  # that blocks inside a `synchronized` block PINS its carrier thread -- JEP 491
  # removes that only from Java 24. Blocking I/O held under `synchronized` is
  # therefore a per-site hazard that has to be surveyed, not assumed away.
  #
  # SCALE-100 S2 already fixed the worst site: LiveConnection#sendLock is now a
  # ReentrantLock (which parks instead of pinning) precisely so the SSE write
  # path is virtual-thread-safe. Others remain reachable from a request thread
  # and have NOT been audited or fixed -- ManualControlWebSocketHandler's
  # `synchronized (state.sendLock)` around a blocking WebSocket send, and
  # MediamtxStreamPublisher, which a stream start/stop request calls directly.
  # LiveRingBuffer's `synchronized` methods are pure in-memory work and are not
  # a concern.
  #
  # So this stays off until those sites are surveyed AND the S0 rig
  # (tools/loadrig) shows a measured win -- not on reasoning alone. The rig and
  # a pre-change baseline both exist now (docs/conclusions/SCALE-100-BASELINE.md),
  # so this is a measurable question rather than an argued one.
  #
  # server.tomcat.max-connections is likewise unpinned: the same baseline should
  # choose it. The S0 numbers show thread count, not connection count, as the
  # binding constraint at 100 viewers.

# Liveness probe (docs/plans/active/SYSTEM-STATUS-PLAN.md §4.4) -- ONLY `health` is exposed over
# HTTP. Deliberately not metrics/env/beans/configprops: this is a container healthcheck endpoint
# (docker-compose.yml's vision-app service) and the /debug page's Health card, not an operator
# metrics surface -- env/beans especially could leak configuration an operator has no reason to see
# over HTTP. Permitted in SecurityConfig regardless of vision.auth.enabled (see that class).
management:
  endpoints:
    web:
      exposure:
        include: health

vision:

  # --- adapter-persistence: fleet persistence (see docs/plans/done/MVP2-PLAN.md P-a) ---
  persistence:
    # PersistenceWiringConfiguration wires CategoryRepositoryPort/
    # DeviceRepositoryPort/AssetRepositoryPort (and the rest of the seventeen
    # repository ports it selects, see vision-app's MODULE.md) to
    # adapter-persistence's JPA/Postgres implementations (migrated with Flyway
    # on first use), unconditionally -- a reachable Postgres is required to run
    # this app, and to run vision-app's own @SpringBootTest suite, which gets
    # one from a shared Testcontainers container (see that module's MODULE.md
    # "Test infrastructure" section); a Docker-less environment skips those
    # tests cleanly rather than failing with a connection error. There used to
    # be a vision.persistence.enabled flag selecting a devsupport in-memory
    # fallback instead; docs/plans/active/POSTGRES-ONLY-CONTEXT.md W2b removed it --
    # a flag with exactly one legal value (true, since W4) was a lie.
    #
    # JDBC URL/credentials of the Postgres database. Defaults match
    # docker-compose.yml's postgres service on its host-mapped port;
    # docker-compose overrides these for vision-app's own container to address
    # the compose-internal hostname instead (see VISION_PERSISTENCE_JDBC_URL
    # there).
    jdbc-url: jdbc:postgresql://localhost:5432/vision
    username: vision
    password: vision
    # Whether PersistenceUnit also applies classpath:db/seed/dev -- three DEV-ONLY
    # accounts (admin/admin, manager/manager, pilot/pilot -- password equal to
    # username) plus the fixed root group they join; there is no in-memory
    # equivalent (docs/plans/active/POSTGRES-ONLY-CONTEXT.md W1 deleted the old
    # code-based AuthSeedRunner, which used to seed unconditionally into
    # whichever repositories were wired). ANY DATABASE WITH THIS ON IS UNSECURED
    # -- docker-compose.yml sets it true for the friends-demo stack; nothing
    # else should.
    seed-dev-users: false
    # HikariCP sizing for the ONE pool PersistenceUnit shares between Flyway and
    # Hibernate (docs/plans/active/SCALE-100-PLAN.md S3). Before S3 there was no
    # pool at all -- Hibernate's built-in DriverManager provider opened a
    # connection per EntityManager and said "not intended for production use" at
    # every startup. Every key below is commented out because it DOCUMENTS the
    # default PersistencePoolSettings.defaults() already declares; uncommenting
    # one changes nothing until you edit it.
    #
    # max-size is the real concurrency ceiling of this app's write path:
    # JpaOperations opens an EntityManager (and therefore takes a connection) per
    # repository call, so a request touching three repositories holds three in
    # sequence. Raise it with Postgres's own max_connections in mind, not in
    # isolation -- the database is the shared resource, and several app instances
    # would each carry a pool of this size.
    # pool:
    #   max-size: 20
    #   min-idle: 5
    #   connection-timeout: 30s
    #   leak-detection-threshold: 30s
    # How the telemetry ingest path batches its writes
    # (docs/plans/active/SCALE-100-PLAN.md S4). Telemetry is the only table
    # written once per incoming sample, and before S4 each of those samples cost
    # a persist + flush() + retention prune, plus a second AssetUsage summary
    # write right behind it -- the per-sample round trip that put a floor under
    # ingest cost. Both writes now wait for whichever bound trips first.
    #
    # These two numbers govern BOTH write paths deliberately: the durable sample
    # write (adapter-persistence's TelemetryBatchSettings) and the coalesced
    # usage-summary write (vision-perception's UsageSummaryBatchSettings) are two
    # Java types only because a context module must not depend on an adapter --
    # they are one ingest decision, so they read one block.
    #
    # batch-window is the honest cost: a sample lives only in this JVM's heap
    # until its batch flushes, so an unclean shutdown loses up to one window per
    # open usage. Set it to 0 for the zero-loss opt-out (every write goes back to
    # synchronous). batch-size is a ceiling for an unusually fast source, not the
    # usual trigger -- at a typical ~1Hz telemetry rate the window is what fires.
    # Commented out because it documents the defaults already in force.
    # telemetry:
    #   batch-size: 100
    #   batch-window: 200ms

  # --- Session auth (docs/plans/done/U-AUTH-PLAN.md wave 3) ---
  auth:
    # false (default): NOTHING is secured -- the Spring Security filter chain is
    # permit-all + CSRF-off, so every existing test and the running SPA behave
    # exactly as before auth existed; CurrentUser returns the fixed dev principal
    # (auto-admin) and /api/auth/* report that dev admin with authEnabled=false.
    # true: a session is required for /api/** except /api/auth/login|logout and
    # static/SPA routes -- but a session only has someone to log in as if
    # vision.persistence.seed-dev-users is also true (see above), or real users
    # were created through UserService.
    enabled: false

  # --- adapter-publish-hls: stream egress (Phase 1, see docs/plans/done/PHASE1-PLAN.md Task U5) ---
  publish:
    # Whether WiringConfiguration wires the mediamtx-backed StreamPublisherPort
    # (adapter-publish-hls). When false, it falls back to the in-process no-op
    # publisher (e.g. local development/testing without mediamtx running).
    enabled: true
    # URL base actually handed to viewers (e.g. via StartStreamResponse.viewUrl),
    # app-relative by default so browsers only ever talk to this app's own
    # origin -- never to mediamtx directly. Rarely needs changing.
    view-base: /hls
    mediamtx:
      # Base RTSP URL of the mediamtx sidecar (see docker-compose.yml) that
      # MediamtxStreamPublisher pushes H.264 to, one stream per <streamId> path.
      rtsp-base: rtsp://localhost:8554
      # Internal address where mediamtx serves HLS; viewers never see it. This app
      # proxies /hls/** (HlsProxyController, vision-api) to this address so the
      # mediamtx HLS port stays purely an implementation detail. The host-side
      # default is 18888 (docker-compose.yml maps 18888->8888) because mediamtx's
      # own default 8888 routinely collides with other dev services -- an actual
      # uvicorn app squatting on 8888 fed HTML to the HLS proxy and broke playback
      # with no error anywhere on the server side. Change this if your mediamtx
      # maps HLS elsewhere; viewers are unaffected either way.
      hls-base: http://localhost:18888
      # mediamtx's WebRTC/WHEP egress base (docs/plans/done/MVP2-PLAN.md L-a), handed to
      # viewers verbatim as StartStreamResponse.whepUrl -- unlike hls-base above,
      # there is no app-relative proxy for WHEP (it's a POST/SDP + ICE exchange,
      # not a byte stream a reverse proxy can forward), so this must already be an
      # address the *browser* can reach. Host-side default is 18889, not mediamtx's
      # own default 8889, for the same collision-avoidance reason as hls-base's
      # 18888 (docker-compose.yml maps 18889->8889); change this if your mediamtx
      # maps WHEP elsewhere.
      whep-base: http://localhost:18889
      # mediamtx's playback HTTP server (docs/plans/done/OPS-CORE-PLAN.md R, docs/plans/done/CV-TRAINING-V2-PLAN.md §7):
      # byte-range-seekable recording playback (UsageTimelineController#recording) and single-frame
      # replay-capture extraction (MediamtxReplayFrameExtractor) both read from here. Default
      # http://localhost:19996 matches docker-compose.yml's host-mapped playback port (mediamtx's own
      # in-container default is 9996) -- byte-identical to what the old whepBase-derived guess produced
      # for a localhost deployment, so this is commented out to document the default rather than
      # override it. A non-localhost whepBase deployment must now set this explicitly (docs/plans/done/CV-TRAINING-V2-PLAN.md
      # §I's one deliberate behavior change -- an implicit guess became an explicit property).
      # playback-base: http://localhost:19996
      # mediamtx's Control API base (docs/plans/active/MEDIA-SOT-PLAN.md §5.3, wave M7) -- MediamtxProxyPublisher's
      # create/patch/get/delete-path calls, only ever reached when source-proxy.enabled=true below. Default
      # http://localhost:19997 matches docker-compose.yml's host-mapped Control API port (mediamtx's own
      # in-container default is 9997, same collision-avoidance convention as hls-base/whep-base/playback-base
      # above). mediamtx's Control API is IP-gated by its own baked-in authInternalUsers config -- unauthenticated
      # api access is granted only to a caller at 127.0.0.1/::1, which neither a docker-published port nor a
      # sibling container satisfies. docker-compose.yml's mediamtx service mounts ./mediamtx.yml (see that file's
      # own comments) to widen this for the compose network, and binds the host port mapping to 127.0.0.1 only
      # (127.0.0.1:19997:9997, not 19997:9997) so that widened allowlist stays reachable only from inside the
      # compose network or this host's own loopback -- never the LAN or internet (see docker-compose.yml's
      # "Control API" port comment for the incident that binding corrected). api-user/api-password below are
      # REQUIRED, not merely a stylistic alternative, whenever mediamtx is NOT co-located with vision-app on the
      # same Docker host -- a remote mediamtx's own loopback binding does nothing for a caller on a different
      # machine, so a real Basic-auth credential (matching a real user configured in that mediamtx's own
      # authInternalUsers, not an ips: [] widening, which only makes sense on a network as trusted as one
      # compose stack's private bridge) is the only safe way to reach it; see .env.example for the worked example.
      # api-base: http://localhost:19997
      # Optional mediamtx Control API Basic-auth credentials. REQUIRED for a mediamtx that isn't reachable via
      # loopback or the compose network (see api-base above); optional for the co-located docker-compose.yml
      # deployment this repo ships, where the mediamtx.yml mount already covers it. Unset by default (no
      # Authorization header sent). api-password is required whenever api-user is set -- MediamtxProxySettings's
      # (adapter-publish-hls) own compact constructor fails fast on a half-configured pair rather than 401ing at
      # the first stream start.
      # api-user:
      # api-password:
    # "mediamtx dials the camera itself" switch (docs/plans/active/MEDIA-SOT-PLAN.md §3 switch A, §5.5, D3/D10,
    # wave M7) -- MediamtxProxyPublisher/PublisherRouter's own config. RTSP-only: PublisherRouter only ever routes
    # a device here when its stream protocol is "rtsp" (sim/mjpeg/v4l2 devices always publish through the direct
    # JVM path regardless of this flag). Every default below reproduces today's behaviour exactly (D1) --
    # source-proxy.enabled=false means PublisherRouter never routes anywhere but the plain MediamtxStreamPublisher
    # this block's siblings already configure.
    # source-proxy:
    #   Whether any RTSP device is ever routed to MediamtxProxyPublisher instead of the JVM decode-and-publish
    #   path. false (default) is today's behaviour: every device publishes through the JVM, unchanged.
    #   REJECTED AT STARTUP (PublishWiring#rejectProxyWithPushTransport) when true while vision.cv.frame-transport
    #   (below) is still "push" -- a proxied source means this JVM never holds a frame to push, so that
    #   combination would start a stream that can never detect.
    #   enabled: false
    #   mediamtx sourceOnDemand for a created/patched path (D10): false (default) dials the camera as soon as the
    #   path is created, so MTX_PATHDEFAULTS_RECORD=yes (docker-compose.yml) records it without waiting for a
    #   viewer. true defers the dial until a reader connects -- MediamtxProxyPublisher then skips the readiness
    #   poll entirely (there is nothing to be "ready" until then), so an on-demand start never times out waiting
    #   for a camera nobody has asked to watch yet.
    #   on-demand: false
    #   rtspTransport sent to mediamtx's Control API when creating/patching a path -- how MEDIAMTX dials the
    #   camera, not how this JVM talks to mediamtx.
    #   rtsp-transport: automatic
    #   How long MediamtxProxyPublisher#streamStarted polls path readiness before failing the start call rather
    #   than returning a viewer URL that would play nothing. Ignored when on-demand is true.
    #   ready-timeout: 10s
    # H264RecorderFactory's x264 rate-control/GOP tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §2.2, wave F3).
    # encoder:
    #   crf: 21
    #   maxrate-bps: 6000000
    #   bufsize-bits: 12000000
    #   preset: veryfast
    #   gop-seconds: 1
    #   scenecut-threshold: 0
    # PublishBackoff's reconnect-throttling bounds.
    # resilience:
    #   initial-backoff: 500ms
    #   max-backoff: 10s
    # CadenceEstimator's cadence-measurement/drift-detection tunables.
    # cadence:
    #   measurement-frames: 5
    #   min-measured-fps: 1.0
    #   max-measured-fps: 120.0
    #   drift-ratio-high: 1.5
    #   drift-ewma-alpha: 0.2
    #   sustained-drift-window: 2s
    #   default-frame-rate-fps: 15.0
    # MediamtxReplayFrameExtractor's clip-window/read-timeout.
    # replay:
    #   window: 1s
    #   read-timeout: 15s

  # --- adapter-cv-grpc: CV inference (see docs/plans/done/MVP1-PLAN.md §C7) ---
  cv:
    # Whether WiringConfiguration wires DetectionPort to GrpcDetectionPort
    # (adapter-cv-grpc), which calls the Python cv-service's DetectStream RPC.
    # When false (default), DetectionPort stays the in-process no-op fallback --
    # today's behavior, no cv-service required to run this app.
    enabled: false
    # host:port of the cv-service's gRPC endpoint. Only read when
    # vision.cv.enabled=true. Default: a locally-run cv-service (the laptop's CPU
    # is ~2x faster per frame than the remote box below). Alternative deployed
    # and kept warm on GB4005 (Intel mini-PC, OpenVINO CPU inference, systemd
    # unit cv-service, ~140ms/frame) per cv/cv-service/DEPLOY-GPU.md -- point the
    # endpoint there to offload inference when the laptop is under load; if that
    # box is off, the backend degrades gracefully (no boxes, video unaffected).
    endpoint: localhost:50051
    # endpoint: 192.168.0.106:50051
    # Widest a raw BGR24 frame may be before GrpcDetectionPort downscales +
    # JPEG-encodes it before sending (docs/plans/done/REMOTE-CV-PLAN.md P1 item 5); lower
    # this over a slow/metered link (e.g. 480 over VPN) to shrink the per-frame
    # wire payload with no rebuild. Only read when vision.cv.enabled=true.
    # detect-width: 640
    # JPEG quality (0,1] GrpcDetectionPort encodes at for that same downscale
    # path; lower trades detail for a smaller payload. Only read when
    # vision.cv.enabled=true.
    # jpeg-quality: 0.8
    # How a DOWNSCALED frame reaches cv-service: auto | jpeg | bgr24
    # (docs/plans/active/CV-RATE-CONTROL-PLAN.md wave R3). The wire has always carried
    # IMAGE_ENCODING_BGR24 and cv-service has always decoded it; only the Java side used to
    # re-encode unconditionally, because the downscale path was written when every deployment was
    # remote. Sending raw removes a JPEG encode here AND a decode there -- together most of the
    # ~25ms of NON-INFERENCE round trip measured on loopback (docs/conclusions/CV-RATE-BUDGET.md 3,
    # where 53.8ms of round trip contained only 29ms of inference).
    # What it costs is payload: 640x360 of BGR24 is ~691 KB against ~40 KB of JPEG. Free over
    # loopback, indefensible over a radio link -- so `auto` (the default) decides from the endpoint
    # itself rather than guessing: raw to localhost/127.x/[::1], JPEG to anything else. Set bgr24
    # explicitly for a wired LAN box (e.g. the GB4005 at 192.168.0.106, ~55 Mbps at 10fps), and
    # jpeg to pin the old behaviour. JPEG frames from an MJPEG source are unaffected either way --
    # they are forwarded byte-identical, never transcoded.
    # wire-format: auto
    # GrpcCvSettings' remaining gRPC transport tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §2.2, wave F4).
    # response-timeout: 2s
    # keepalive-time: 20s
    # keepalive-timeout: 5s
    # keepalive-without-calls: true
    # channel-shutdown-timeout: 5s
    # Whether the host/port channel skips TLS. Honoured as of docs/plans/active/CV-RECONNECT-PLAN.md
    # wave R2 -- setting this to false now actually turns TLS on (previously CvWiring#cvGrpcChannel
    # called .usePlaintext() unconditionally, so the property was a config lie: an operator setting
    # plaintext: false believed they had TLS and silently didn't). Note the honest limit: false yields
    # the JDK default trust chain, which will NOT validate a self-signed cv-service certificate --
    # custom trust material is a separate concern, not built here.
    # plaintext: true
    # GrpcDatasetUploadPort's per-call deadline and zip-chunk framing size.
    # upload:
    #   timeout: 300s
    #   chunk-bytes: 262144
    # GrpcModelRegistryPort's per-call deadline (ListModels/PromoteModel).
    # registry:
    #   call-timeout: 10s
    # Bounded reconnect for the shared cv-service channel (docs/plans/active/CV-RECONNECT-PLAN.md).
    # A fail-fast gRPC call issued while the channel is in TRANSIENT_FAILURE returns the cached failure
    # WITHOUT starting a new connect attempt -- only the channel's OWN reconnect backoff retries, and
    # that backoff escalates towards ~120s. Left alone, this means the time between cv-service coming
    # back up and detection resuming depends entirely on where in that escalation the restart happened
    # to land -- anywhere from under a second to two minutes. CvChannelSupervisor closes that gap: while
    # the channel is unreachable it forces a reconnect attempt on ITS OWN schedule instead, so recovery
    # is bounded by max-backoff below rather than by gRPC's escalation. Worst case end to end is
    # max-backoff (10s) for the channel to reopen plus one more detection-side probe cycle (also capped
    # at 10s, StreamPipeline's own outage backoff) -- about 20s from cv-service restarting to detections
    # resuming, versus unbounded (observed up to and beyond 2 minutes) before this existed.
    # reconnect:
    #   Master switch. false restores the exact pre-CV-RECONNECT behaviour: no gate, no forced
    #   reconnect, GrpcDetectionPort's plain two-arg constructor -- the escape hatch if this loop is
    #   ever suspected of misbehaving in a deployment.
    #   enabled: true
    #   How long the supervisor waits, the first time the channel enters TRANSIENT_FAILURE, before
    #   forcing a reconnect attempt.
    #   initial-backoff: 1s
    #   Cap the doubling forced-reconnect wait never exceeds -- this is the number that bounds worst-case
    #   recovery latency (see above).
    #   max-backoff: 10s
    #   How often an INFO heartbeat naming the outage duration is logged while it continues -- replaces
    #   what would otherwise be a WARN-with-full-stack-trace flood (one per failed detection probe, every
    #   probe identical and worthless) with one predictable line per interval.
    #   outage-log-interval: 60s
    # How frames reach cv-service (docs/plans/active/MEDIA-SOT-PLAN.md §3 switch B, §5.5, D5/D12, wave M7):
    # push | pull. push (default) is today's behaviour, byte-identical (D1): this JVM samples frames and sends
    # them to cv-service over the DetectStream RPC (the detect-width/jpeg-quality/wire-format knobs above). pull
    # switches EVERY stream this deployment starts (one deployment-wide choice, not per-device -- only proxying
    # video, source-proxy.enabled above, is decided per device) to the DetectPulled RPC instead: cv-service dials
    # mediamtx itself (pull.rtsp-base below) and decodes/infers on its own schedule, reporting decode/achieved-fps/
    # dropped-frame diagnostics back on the wire. Needs vision.cv.enabled=true OR this set to pull for the shared
    # gRPC channel to be built at all (CvWiring#cvGrpcChannel's condition covers both).
    # frame-transport: push
    # Worker-pull config surface (docs/plans/active/MEDIA-SOT-PLAN.md §5.5); only read when frame-transport=pull.
    # pull:
    #   Base RTSP URL the WORKER (cv-service) dials -- deliberately separate from
    #   vision.publish.mediamtx.rtsp-base above: a remote worker (e.g. the GB4005 box) must dial the host's LAN
    #   address, not localhost, even though both properties often point at the same mediamtx instance in a
    #   single-box deployment. docker-compose.yml sets this to the compose-internal rtsp://mediamtx:8554 for
    #   vision-app's own container (VISION_CV_PULL_RTSP_BASE), which is also reachable from cv-service's
    #   container on the same compose network.
    #   rtsp-base: rtsp://localhost:8554
    #   How long a pulled stream's reopen waits before its first/max retry after a failure -- mirrors
    #   vision.publish.resilience.initial-backoff/.max-backoff's shape and defaults exactly.
    #   reconnect-initial-backoff: 500ms
    #   reconnect-max-backoff: 10s
    # What a NEW stream's PipelineConfig.detectionEnabled starts at (docs/plans/active/CV-DEMAND-PLAN.md
    # §1/§3.7/§3.8) -- StreamController/AssetStreamController/DemoFleet all merge request overrides
    # onto this deployment default rather than the domain's own PipelineConfig.defaults() directly, so
    # this one key reaches every start path. false (default): every stream starts with detection OFF
    # -- "just video" until an operator turns it on, per the owner's own framing. An explicit
    # detectionEnabled in a start request, or a later PATCH .../config, always wins over this default.
    # detection-default-enabled: false
    # The system-derived detection-demand gate (docs/plans/active/CV-DEMAND-PLAN.md §2-3.7): inference
    # only runs when BOTH detection-default-enabled (or a later PATCH)'s operator intent AND someone is
    # actually consuming the output -- an open Fly cockpit (SSE detections:<assetId>) or a recent
    # GET /api/streams/{id}/detections poll (Wall/Live pages). Un-gated (demand always true) is what a
    # deployment with demand.enabled=false, or CvWiring#detectionDemandPort's bean simply not built,
    # falls back to -- exactly today's behavior, no stream ever stops detecting for lack of a viewer.
    # demand:
    #   Whether DefaultStreamService schedules its demand-poll task at all. false: the
    #   DetectionDemandPort bean is never even created, so every stream's detectionDemand stays
    #   fail-open true for the JVM's life -- the escape hatch for a deployment that wants unattended
    #   alerting (DetectionEvent debouncing) to keep running with nobody watching.
    #   enabled: true
    #   How often the demand-poll task re-evaluates every running stream's demand.
    #   poll-interval: 2s
    #   How long a stream keeps detecting after its last observed demand, so navigating between pages
    #   does not thrash the detector on and off.
    #   grace: 30s
    #   How long one GET /api/streams/{id}/detections poll counts as demand (the poll half, for
    #   Wall/Live pages that never open the SSE detections:<assetId> topic at all).
    #   poll-ttl: 10s

  # --- Tracking engine (docs/plans/done/TRACKING-PLAN.md, docs/extracts/TRACKING-ORCHESTRATION.md 4.3) ---
  # Every key below is commented out: each documents VisionTrackingProperties' default rather than
  # overriding it, and every default leaves behavior exactly as it was before tracking existed.
  #
  # The first three SEED NEW STREAMS ONLY -- they are merged into the PipelineConfig the two REST
  # start-stream endpoints build, and never reach into a stream that is already running (a running
  # stream's tracking config is its own state, changed only by PATCH /api/streams/{id}/config).
  # Restart a stream to pick up a changed default; that is deliberate, not a limitation.
  #
  # The last two configure the per-stream READ MODELS (vision-application's TrackingStatsWindow and
  # TrackBook, via StreamPipelineSettings), so unlike the seeds they apply to every stream this
  # instance starts from then on.
  #
  # The remaining wire knobs of the tracking contract (redetect IoU, max age frames, min hits) have
  # no key here on purpose: they are resolved inside cv-service from CV_TRACK_IOU / CV_TRACK_MAX_AGE /
  # CV_TRACK_MIN_HITS, and duplicating them would give one number two owners. The engine roster
  # GET /api/cv/trackers serves is a static in-source list (TrackingWiring#cvTrackerRoster), exactly
  # like GET /api/cv/models'.
  # tracking:
  #   Mode new streams start in: OFF | ASSOCIATE | FOLLOW. Defaults to ASSOCIATE (wave T8), matching
  #   the domain's own PipelineConfig.defaults(): every detection gets a stable id across frames, for
  #   ~0.8 ms/frame against a ~23 ms detector pass. Set OFF for the pre-tracking behavior byte-for-byte
  #   -- no track ids, no tracker, an unchanged wire payload. FOLLOW holds one locked target per frame
  #   and duty-cycles the detector down to a periodic verify pass; it is normally reached per stream by
  #   clicking a box, not by starting every stream locked.
  #   default-mode: ASSOCIATE
  #   The JAVA-side sampler's target frame rate while FOLLOW is active (docs/plans/done/TRACKING-PLAN.md 5.D):
  #   the tracker wants frames faster than vision.application.pipeline's inference rate. 15 rather
  #   than "every frame" on purpose -- ~1.2 MB/s per stream, which survives a VPN link, for a tracker
  #   that gains little from more samples at typical target speeds. cv-service has no such knob: it
  #   must never care how often it is fed.
  #   follow-fps: 15
  #   FOLLOW's detector re-verify cadence in milliseconds -- how often a full detector pass re-approves
  #   and re-anchors the tracked box. Raising it lowers CPU and raises drift.
  #   verify-every-millis: 2000
  #   How far back the duty-cycle counters reach -- what GET /api/streams/{id}/tracks reports as
  #   stats.windowSeconds and what the cockpit's flow strip is computed over.
  #   stats-window-seconds: 30
  #   How long a track that stops arriving stays in the track book before expiring.
  #   track-retention-seconds: 5
  #   The capability-ladder ceiling (docs/plans/active/TRACKING-V3-BAND1-CONTEXT.md §2) requested for
  #   every newly started stream, 0-5. 0 means auto-probe: cv-service picks the highest level its own
  #   host affords. A level is a CEILING, not a demand -- cv-service serves min(requested, affordable)
  #   and reports what it actually served; this can only cap a strong host down, never make a weak one
  #   run a level it cannot afford.
  #   capability-level: 0
  #   The longest gap ORU (Observation-Centric Re-Update) may reconstruct for every newly started
  #   stream, in milliseconds. 0 means cv-service's own server-side default.
  #   reupdate-max-gap-millis: 0

  # --- adapter-discovery: device discovery (see docs/plans/done/DISCOVERY-PLAN.md Task D4) ---
  discovery:
    # Whether DiscoveryWiringConfiguration registers the discovery scanner beans
    # (adapter-discovery: ONVIF WS-Discovery, mDNS, V4L2 enumeration). When
    # false, POST /api/discovery/scan still works but degrades to an empty
    # result (no scanners registered) -- useful in restricted environments
    # without multicast/network access or a /dev tree to enumerate.
    enabled: true
    # UDP port MavlinkHeartbeatScanner listens on for MAVLink heartbeats -- the
    # well-known GCS port every telemetry radio/SITL pushes to by default. Also
    # echoed as GET /api/system/network's mavlinkPort field (docs/plans/active/DRONE-INFRA-PLAN.md
    # I-g) so the onboarding wizard's generated snippets can never target a
    # different port than the scanner actually listens on. Commented out here to
    # document the default rather than override it.
    # mavlink-port: 14550
    # MdnsScanner's scan-timing budget (docs/plans/active/LAYERING-REFACTOR-PLAN.md §2.2, wave F4) -- cushions carved
    # out of a caller-requested scan window; changing these changes scan-timing behavior
    # (MdnsScannerLoopbackTest and DefaultDiscoveryService's own 200ms caller grace are coupled to them).
    # mdns:
    #   join-grace: 150ms
    #   safety-margin: 50ms
    #   min-list-window: 50ms
    # V4l2Scanner's filesystem bases -- only ever overridden in tests.
    # v4l2:
    #   dev-base: /dev
    #   sys-base: /sys

  # --- vision-api: server-push data plane (see docs/plans/done/REALTIME-PLAN.md §4) ---
  live:
    # Whether WiringConfiguration wires LiveUpdatePublisherPort to the real
    # vision-api LiveUpdateRegistry (which also backs GET /api/live). When false,
    # /api/live 404s (its controller/registry beans are conditionally absent
    # entirely) and the port falls back to a no-op -- steady-state polling is the
    # only way to observe fleet/telemetry/detections/event changes in that case.
    enabled: true

  # --- vision-api: per-principal request rate limit (docs/plans/active/SCALE-100-PLAN.md S6) ---
  # (the rest of vision.api.* is the commented tunables block further down; this
  # one is a live toggle, so it is spelled out here rather than buried there.)
  api:
    rate-limit:
      # A blast-radius bound, NOT security hardening: it stops one runaway client
      # -- a retry loop, a poll that never backs off -- from degrading the app for
      # every other user sharing this JVM. RateLimitFilter (vision-api) gives each
      # principal an independent token bucket and answers 429 past it. /api/live
      # and /hls/** are never limited: a token bucket in front of a long-lived
      # stream is a self-inflicted outage.
      #
      # OFF by default, deliberately. Buckets are keyed on the acting principal,
      # and with vision.auth.enabled=false that is ONE fixed dev principal for the
      # whole deployment -- so turning this on there gives every caller combined a
      # single budget, which 100 concurrent users would exhaust on legitimate
      # traffic alone. Turn it on together with auth, where each real user gets
      # their own bucket and the limit measures what it is meant to measure.
      enabled: false
      # Per-principal capacity and refill rate, permits per rolling minute. The
      # bucket refills continuously rather than resetting on a clock tick, so a
      # full minute's allotment may also be spent as one burst. 600 is roughly ten
      # ungated cockpit tabs' worth of polling for one principal (SCALE-100 §2.1
      # measures a tab at ~1 req/s). Commented out: it documents the default.
      # permits-per-minute: 600

  # --- adapter-simulation: simulated feeds + resume-on-boot (SimulationService#resumeAll) ---
  simulation:
    # Whether SimulationResumeRunner calls SimulationService#resumeAll() once at
    # boot, restarting the TX feed for every persisted simulated asset whose rtsp
    # video device is one of this app's own TX-fed feeds (fixes "frozen video"
    # after a restart -- see DefaultSimulationService#resumeAll's own javadoc).
    resume-on-boot: true
    # SimulatedVideoSource's default frame width/height/fps (docs/plans/active/LAYERING-REFACTOR-PLAN.md §2.2, wave F4).
    # video:
    #   width: 640
    #   height: 480
    #   fps: 15
    # SimulatedTelemetrySource's default circular-track center/radius/cadence/battery-drain.
    # telemetry:
    #   center-latitude: 50.45
    #   center-longitude: 30.52
    #   track-radius-meters: 200
    #   period: 1s
    #   battery-drain-percent-per-second: 0.05


  # --- RC manual-control relay (docs/plans/done/RC-CONTROL-PHASE1-PLAN.md, RC-CONTROL Phase 1) ---
  # rc:
  #   Input-loss watchdog timeout (milliseconds) for a /ws/manual-control relay session: a session
  #   with no "channels" frame for this long auto-releases (WiringConfiguration#manualControlService,
  #   ManualControlWebSocketHandler). SITL-tune this against the measured glass-to-stick latency
  #   (docs/plans/done/RC-CONTROL-PHASE1-PLAN.md's SITL verification steps 6-7) before relying on it. Commented
  #   out here to document the default rather than override it.
  #   watchdog-timeout-ms: 300
  #   MavlinkManualControlSender's RC_CHANNELS_OVERRIDE cadence (docs/plans/active/LAYERING-REFACTOR-PLAN.md §2.2,
  #   wave F2) -- replaces the VISION_RC_OVERRIDE_HZ/VISION_RC_RELEASE_FRAMES environment variables that
  #   used to be the only place in the repo bypassing Spring config entirely.
  #   override-hz: 33
  #   min-override-hz: 10
  #   max-override-hz: 50
  #   release-frames: 3

  # --- Vehicle onboarding: probe / readiness / remediation (docs/plans/active/DRONE-ONBOARDING-PLAN.md §8.1, Wave O5) ---
  onboarding:
    probe:
      # false (default, D17): VehicleConfigPort has no real implementation wired
      # (OnboardingWiringConfiguration falls back to NoopVehicleConfigPort) -- POST
      # /api/onboarding/probe and every /api/assets/{id}/probe|remediate call 409 naming this flag,
      # and readiness still answers from whatever was already probed (or UNKNOWN if never). true:
      # adapter-mavlink's MavlinkVehicleConfigurator (O4) is wired instead, and probes talk to real
      # firmware over the same link the aircraft already streams telemetry on. Reads only -- turning
      # this on does not let the platform write to an aircraft.
      enabled: false
      # How long a PROBE listens to the link before summarizing the passive message inventory
      # (VehicleConfigPort#probe's window argument). Commented out here to document the default
      # rather than override it.
      # inventory-window: 10s
      # Per-request timeout for one capability/parameter read during a probe. Note that an absent
      # parameter name costs a full timeout: MAVLink gives an autopilot no way to say "I don't have
      # that", so it simply says nothing.
      # request-timeout: 3s
    remediate:
      message-interval:
        # false (default): no MAV_CMD_SET_MESSAGE_INTERVAL is ever sent. true: every gateway asks
        # each aircraft it learns for the configured message set, so a link that streams almost
        # nothing starts streaming what the platform needs. This is the plan's one deliberate
        # exception to "nothing automatic from discovery" (§6.2 rule 3), which is why it is a
        # separate flag from probe.enabled above -- an operator who wants to *look* at an aircraft
        # should not thereby be made to *transmit* to it. Nothing is written and nothing persists:
        # the request is session-scoped on the wire and a reboot forgets it. Measured on ArduPilot
        # Copter 4.7, a fresh link carries four message types until this asks for more.
        enabled: false
    passport:
      # false (default): no UsagePhaseObserver bean is wired at all -- a usage's PREFLIGHT/POSTFLIGHT
      # phase transition (UsageTracker, vision-perception) folds exactly as it did before Wave O11
      # existed, and no VehicleProfile snapshot is ever captured or attached to the AssetUsage. true:
      # OnboardingWiringConfiguration#passportCaptureObserver captures a snapshot at PREFLIGHT (the
      # usage's opening) and again at POSTFLIGHT, via VehicleProfileService#captureSnapshot, audited
      # under the platform actor (PlatformActor.USER_ID, vision-platform) rather than a real person.
      # Needs probe.enabled=true above to do anything real -- with it false, VehicleConfigPort is
      # NoopVehicleConfigPort, so every capture attempt fails with the expected "no device this
      # platform can probe" (logged once per usage, at DEBUG, no stack trace), and this app logs one
      # startup WARNING naming both flags so that combination is never silently inert.
      enabled: false

  # --- CV model-improvement training loop (docs/plans/done/CV-TRAINING-PLAN.md, Wave T4; delta docs/plans/done/CV-TRAINING-V2-PLAN.md) ---
  training:
    # false (default): DatasetController/LabelingController/TrainingJobController and every training
    # bean (DatasetService/LabelingService/TrainingStores/DatasetUploadPort) are entirely absent from
    # the context -- /api/datasets, /api/streams/{id}/samples, /api/usages/{id}/samples,
    # /api/samples/{id}/*, and /api/datasets/{id}/train all 404 like any other unmapped route, exactly
    # as before this feature existed. true: wires the capture -> label -> train pipeline
    # (TrainingWiringConfiguration); training kicks off a gRPC dataset upload to cv-service, no
    # on-disk export artifact is ever written.
    enabled: false

    # --- vision-application tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §1.3/§2.2, Wave A) ---
    # Every key below is commented out: each documents VisionApplicationProperties' default rather than
    # overriding it -- a freshly-built app behaves exactly as before this record existed.
    # application:
    #   Small fixed allowance (milliseconds) added to a discovery scan's requested timeout when bounding
    #   the overall wait (DefaultDiscoveryService#GRACE_PERIOD).
    #   discovery-grace-ms: 200
    #   DefaultReplayService's downsampling/fetch-bound tunables.
    #   replay:
    #     default-max-points: 500
    #     max-points-ceiling: 2000
    #     fetch-limit: 20000
    #   DefaultAssetStatsService's flight-history fetch bound.
    #   stats:
    #     fetch-limit: 10000
    #   DefaultFleetSummaryService's per-asset list cap and open-detection-events scan bound.
    #   fleet:
    #     max-assets: 500
    #     open-events-scan-limit: 2000
    #   DefaultTrainingJobService's finished-job retention cap and DefaultLabelingService's captured
    #   training-frame JPEG quality.
    #   training:
    #     max-finished-jobs: 50
    #     jpeg-quality: 0.9
    #   StreamPipeline's frame-cadence measurement (assumed fps before the measured rate is trusted, EWMA
    #   smoothing, warmup frame count, measured-fps sanity clamp) and its own detection-outage retry
    #   backoff. source-reopen-backoff is DefaultStreamService's video-source reopen backoff
    #   (SupervisedPublisher) -- deliberately a different bound than detection-backoff
    #   (docs/plans/active/LAYERING-REFACTOR-PLAN.md §2.3): an unrelated failure with an unrelated
    #   recovery cost, not unified.
    #   pipeline:
    #     assumed-source-fps: 30
    #     measured-fps-ewma-alpha: 0.2
    #     warmup-frames: 5
    #     min-measured-fps: 1.0
    #     max-measured-fps: 240.0
    #     detection-backoff:
    #       initial-ms: 1000
    #       max-ms: 10000
    #     source-reopen-backoff:
    #       initial-ms: 1000
    #       max-ms: 30000
    #     The camera's HORIZONTAL field of view in degrees. This is the scale that turns a telemetry
    #     attitude delta into a pixel shift, which is what lets cv-service's `pose` ego-motion
    #     compensator run at all (docs/conclusions/CV-RATE-BUDGET.md §2): at 640 px across 60 deg, a
    #     30 deg/s yaw moves the whole scene 32 px between frames at 10 fps, while a 15 m/s vehicle at
    #     200 m contributes about 4 -- so on a moving platform the camera, not the target, is what
    #     breaks association.
    #     0 = UNKNOWN, and that is the shipped default: with no value here no CameraPose is sent and
    #     cv-service falls back to estimating ego-motion from pixels (`flow`). Deliberately not a
    #     plausible-looking guess such as 60 -- a wrong FOV produces a confidently wrong pixel shift,
    #     which is worse than no compensation at all. Set it to your actual lens.
    #     One value per instance, not per camera: a deployment mixing lenses needs this lifted onto
    #     the asset, which is the follow-up this default is deliberately conservative for.
    #     camera-hfov-degrees: 0.0
    #     ADAPTIVE RATE (docs/plans/active/CV-RATE-CONTROL-PLAN.md wave R2). A fixed inference rate is
    #     both wasteful when nothing is moving and far too slow during a manoeuvre: at 30 deg/s of
    #     yaw across a 60 deg lens the scene shifts half a frame width per second, which a 0.2-wide
    #     box loses association with in well under a second (docs/conclusions/CV-RATE-BUDGET.md 2).
    #     When enabled, the sampler raises its rate toward what the tracked target's own motion
    #     demands -- displacement per second divided by the association budget w(1-t)/(1+t) -- and
    #     leaves it exactly at inference-fps whenever nothing is tracked or nothing is moving.
    #     It can only ever RAISE the rate above the operator's inference-fps, never lower it, and it
    #     is bounded at runtime by the source's own frame rate and by measured detector capacity
    #     (max-in-flight / round trip), so a cv-service that slows down lowers the rate feeding it.
    #     Target motion works on any deployment; the ego-motion term needs camera-hfov-degrees above
    #     and is simply absent without it, never estimated from a guess.
    #     Set enabled: false to pin the rate to exactly inference-fps. On a metered link prefer
    #     lowering max-fps -- a capped adaptive rate still spends its frames where they are needed.
    #     adaptive-rate:
    #       enabled: true
    #       max-fps: 30.0
    #       ewma-alpha: 0.2
    #   DetectionExtrapolator's smoothing tunables (how far past the latest completed result's capture
    #   time it extrapolates, and the max normalized box-center distance for a same-label match).
    #   extrapolation:
    #     max-millis: 800
    #     match-gate: 0.15
    #   DefaultSimulationService's MAVLink-transport fallback defaults.
    #   simulation:
    #     mavlink-loopback-host: 127.0.0.1
    #     fallback-latitude: 50.45
    #     fallback-longitude: 30.52

    # --- vision-api tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §1.3/§2.2, Wave B; Spring-bound wave D) ---
    # Every key below is commented out: each documents VisionApiProperties' default rather than
    # overriding it -- a freshly-built app behaves exactly as before this record existed. Note:
    # vision-api's own com.drones.vision.api.support.VisionApiProperties is the framework-free mirror
    # this binds onto (see that record's own "Wiring status" javadoc); this is the Spring-bound
    # com.drones.vision.app.config.properties.VisionApiProperties (wave D) that PublishWiring maps
    # across to build a real SnapshotJpegEncoder bean. HlsProxyController and LiveUpdateRegistry now
    # read their own hls-proxy/live fields below too (docs/plans/active/SCALE-100-PLAN.md §5 S7,
    # via PublishWiring#hlsProxySettings/#liveSettings) -- AssetImageController and the
    # per-controller paging defaults are the only ones still reading their own local constants
    # (not yet threaded through this record's own paging/upload fields below).
    # api:
    #   SnapshotJpegEncoder's downscale/encode tunables (docs/plans/done/MVP3-PLAN.md C-a).
    #   snapshot:
    #     max-width: 480
    #     jpeg-quality: 0.8
    #   HlsProxyController's upstream HttpClient timeouts and buffer/redirect bounds.
    #   hls-proxy:
    #     connect-timeout: 5s
    #     request-timeout: 15s
    #     error-body-preview-max-chars: 200
    #     max-redirect-hops: 5
    #   The SSE data plane's coalescing/heartbeat cadence, per-topic ring-buffer capacities, and
    #   LiveUpdateRegistry's per-connection dispatch bounds (docs/plans/done/REALTIME-PLAN.md §4;
    #   send-timeout/buffer-eviction added docs/plans/active/SCALE-100-PLAN.md §5 S2/S7). No
    #   dispatch-threads key: LiveUpdateRegistry dispatches connection writes on
    #   Executors.newVirtualThreadPerTaskExecutor(), which has no pool-size/thread-count concept to
    #   configure -- see that field's own javadoc for why this key is deliberately not offered.
    #   live:
    #     coalesce: 150ms
    #     heartbeat: 15s
    #     telemetry-buffer: 50
    #     event-buffer: 300
    #     detection-buffer: 300
    #     map-buffer: 300
    #     send-timeout: 3s
    #     buffer-eviction: 60s
    #   Shared default/max page size for list endpoints that accept a limit query parameter (e.g.
    #   ActivityController's GET /api/me/activity).
    #   paging:
    #     default-limit: 50
    #     max-limit: 500
    #   AssetImageController's upload size cap, bytes (docs/plans/done/UX-REWORK-PLAN.md §U-d item 3).
    #   upload:
    #     max-image-bytes: 2097152
    #   RateLimitFilter's per-principal budget lives in the ACTIVE vision.api.rate-limit block above,
    #   not here -- it gates whether a filter is registered at all, so it is a live toggle rather
    #   than a documented default.

    # --- adapter-rtsp tunables (docs/plans/active/LAYERING-REFACTOR-PLAN.md §1.3/§2.2, Wave F1) ---
    # Every key below is commented out: each documents FfmpegSettings' default rather than overriding
    # it -- a freshly-built app behaves exactly as before this record existed. Maps onto FfmpegVideoSource
    # (RX) and RtspFeedTransmitter (TX, transmit.* only).
    # rtsp:
    #   transport: tcp
    #   open-timeout: 10s
    #   probesize-bytes: 32768
    #   analyze-duration: 1s
