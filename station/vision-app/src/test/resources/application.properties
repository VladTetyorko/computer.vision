# Test-wide default (docs/plans/active/ARCHITECTURE-AUDIT-2026-08-26.md R7).
#
# Deliberately a .properties file, not a same-named application.yaml: this module's
# src/main/resources/application.yaml already carries every other vision.* default (mediamtx
# bases, persistence, publish, ...), and a classpath:/application.yaml resource is resolved by
# plain classloader lookup (ClassLoader#getResource, singular) -- a second file at that exact
# path in src/test/resources would SHADOW the main one outright rather than merge with it, silently
# reverting every other property to its bare Java-record default for the whole module's test suite.
# (This was tried first and caught by PublishWiringTest#whepUrlIsMediamtxsOwnAddressPerHostModeDefault
# failing over an unrelated port default -- proof the shadowing, not a merge, is what actually
# happens.) A same-base-name application.properties is a different resource, so it loads alongside
# application.yaml rather than instead of it -- Spring Boot's own documented precedence for two
# application.* files at the same config-data location is that .properties wins over .yaml/.yml for
# any key both define, which is exactly what this one key needs.
#
# vision.auth.enabled now defaults to true in production (SecurityConfig). Flipping it back to
# false here, for tests only, keeps every pre-existing full-context MockMvc/@SpringBootTest below
# behaving exactly as it did before the default flip: unauthenticated, dev principal, unbounded
# VisibilityScope. A test that specifically exercises the secured chain (AuthEnabledFlowTest,
# ScopedAssetReadAuthEnabledTest, OrgManagementAuthEnabledTest, ManualControlSecurityEnabledTest, ...)
# overrides this back to true via its own @SpringBootTest(properties = "vision.auth.enabled=true")
# -- inlined test properties always take precedence over any application.properties/.yaml, main or
# test, so that override is never shadowed by this file.
vision.auth.enabled=false
