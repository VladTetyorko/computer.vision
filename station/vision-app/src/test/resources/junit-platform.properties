# docs/plans/done/POSTGRES-ONLY-CONTEXT.md W4: turns on JUnit 5's ServiceLoader-based extension
# auto-detection so com.drones.vision.app.testsupport.DockerGatedExecutionCondition (registered via
# META-INF/services/org.junit.jupiter.api.extension.Extension) applies to every test class in this
# module without a per-class @ExtendWith -- the same reason it exists: 34 @SpringBootTest classes
# need a Docker gate, and per-class annotation is exactly the noise docs/plans/done/POSTGRES-ONLY-CONTEXT.md
# W4 rules out.
junit.jupiter.extensions.autodetection.enabled=true
