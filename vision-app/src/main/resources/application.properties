spring.application.name=vision

# --- Stream egress (Phase 1, see docs/PHASE1-PLAN.md Task U5) ---------------
# Whether WiringConfiguration wires the mediamtx-backed StreamPublisherPort
# (adapter-publish-hls). When false, it falls back to the in-process no-op
# publisher (e.g. local development/testing without mediamtx running).
vision.publish.enabled=true
# Base RTSP URL of the mediamtx sidecar (see docker-compose.yml) that
# MediamtxStreamPublisher pushes H.264 to, one stream per <streamId> path.
vision.publish.mediamtx.rtsp-base=rtsp://localhost:8554
# Internal address where mediamtx serves HLS; viewers never see it. This app
# proxies /hls/** (HlsProxyController, vision-api) to this address so the
# mediamtx HLS port stays purely an implementation detail. The host-side
# default is 18888 (docker-compose.yml maps 18888->8888) because mediamtx's
# own default 8888 routinely collides with other dev services -- an actual
# uvicorn app squatting on 8888 fed HTML to the HLS proxy and broke playback
# with no error anywhere on the server side. Change this if your mediamtx
# maps HLS elsewhere; viewers are unaffected either way.
vision.publish.mediamtx.hls-base=http://localhost:18888
# mediamtx's WebRTC/WHEP egress base (docs/MVP2-PLAN.md L-a), handed to
# viewers verbatim as StartStreamResponse.whepUrl -- unlike hls-base above,
# there is no app-relative proxy for WHEP (it's a POST/SDP + ICE exchange,
# not a byte stream a reverse proxy can forward), so this must already be an
# address the *browser* can reach. Host-side default is 18889, not mediamtx's
# own default 8889, for the same collision-avoidance reason as hls-base's
# 18888 (docker-compose.yml maps 18889->8889); change this if your mediamtx
# maps WHEP elsewhere.
vision.publish.mediamtx.whep-base=http://localhost:18889
# URL base actually handed to viewers (e.g. via StartStreamResponse.viewUrl),
# app-relative by default so browsers only ever talk to this app's own
# origin -- never to mediamtx directly. Rarely needs changing.
vision.publish.view-base=/hls
# mediamtx's playback HTTP server (docs/OPS-CORE-PLAN.md R, docs/CV-TRAINING-V2-PLAN.md §7):
# byte-range-seekable recording playback (UsageTimelineController#recording) and single-frame
# replay-capture extraction (MediamtxReplayFrameExtractor) both read from here. Default
# http://localhost:19996 matches docker-compose.yml's host-mapped playback port (mediamtx's own
# in-container default is 9996) -- byte-identical to what the old whepBase-derived guess produced
# for a localhost deployment, so this is commented out to document the default rather than
# override it. A non-localhost whepBase deployment must now set this explicitly (docs/CV-TRAINING-V2-PLAN.md
# §I's one deliberate behavior change -- an implicit guess became an explicit property).
# vision.publish.mediamtx.playback-base=http://localhost:19996
# H264RecorderFactory's x264 rate-control/GOP tunables (docs/LAYERING-REFACTOR-PLAN.md §2.2, wave F3).
# vision.publish.encoder.crf=21
# vision.publish.encoder.maxrate-bps=6000000
# vision.publish.encoder.bufsize-bits=12000000
# vision.publish.encoder.preset=veryfast
# vision.publish.encoder.gop-seconds=1
# vision.publish.encoder.scenecut-threshold=0
# PublishBackoff's reconnect-throttling bounds.
# vision.publish.resilience.initial-backoff=500ms
# vision.publish.resilience.max-backoff=10s
# CadenceEstimator's cadence-measurement/drift-detection tunables.
# vision.publish.cadence.measurement-frames=5
# vision.publish.cadence.min-measured-fps=1.0
# vision.publish.cadence.max-measured-fps=120.0
# vision.publish.cadence.drift-ratio-high=1.5
# vision.publish.cadence.drift-ewma-alpha=0.2
# vision.publish.cadence.sustained-drift-window=2s
# vision.publish.cadence.default-frame-rate-fps=15.0
# MediamtxReplayFrameExtractor's clip-window/read-timeout.
# vision.publish.replay.window=1s
# vision.publish.replay.read-timeout=15s

# --- CV inference (see docs/MVP1-PLAN.md §C7) --------------------------------
# Whether WiringConfiguration wires DetectionPort to GrpcDetectionPort
# (adapter-cv-grpc), which calls the Python cv-service's DetectStream RPC.
# When false (default), DetectionPort stays the in-process no-op fallback --
# today's behavior, no cv-service required to run this app.
vision.cv.enabled=false
# host:port of the cv-service's gRPC endpoint. Only read when
# vision.cv.enabled=true. Default: a locally-run cv-service (the laptop's CPU
# is ~2x faster per frame than the remote box below). Alternative deployed
# and kept warm on GB4005 (Intel mini-PC, OpenVINO CPU inference, systemd
# unit cv-service, ~140ms/frame) per cv-service/DEPLOY-GPU.md -- point the
# endpoint there to offload inference when the laptop is under load; if that
# box is off, the backend degrades gracefully (no boxes, video unaffected).
vision.cv.endpoint=localhost:50051
# vision.cv.endpoint=192.168.0.106:50051
# Widest a raw BGR24 frame may be before GrpcDetectionPort downscales +
# JPEG-encodes it before sending (docs/REMOTE-CV-PLAN.md P1 item 5); lower
# this over a slow/metered link (e.g. 480 over VPN) to shrink the per-frame
# wire payload with no rebuild. Only read when vision.cv.enabled=true.
# vision.cv.detect-width=640
# JPEG quality (0,1] GrpcDetectionPort encodes at for that same downscale
# path; lower trades detail for a smaller payload. Only read when
# vision.cv.enabled=true.
# vision.cv.jpeg-quality=0.8
# GrpcCvSettings' remaining gRPC transport tunables (docs/LAYERING-REFACTOR-PLAN.md §2.2, wave F4).
# vision.cv.response-timeout=2s
# vision.cv.keepalive-time=20s
# vision.cv.keepalive-timeout=5s
# vision.cv.keepalive-without-calls=true
# vision.cv.channel-shutdown-timeout=5s
# vision.cv.plaintext=true
# GrpcDatasetUploadPort's per-call deadline and zip-chunk framing size.
# vision.cv.upload.timeout=300s
# vision.cv.upload.chunk-bytes=262144
# GrpcModelRegistryPort's per-call deadline (ListModels/PromoteModel).
# vision.cv.registry.call-timeout=10s

# --- Tracking engine (docs/TRACKING-PLAN.md, docs/TRACKING-ORCHESTRATION.md 4.3) --------------
# Every key below is commented out: each documents VisionTrackingProperties' default rather than
# overriding it, and every default leaves behavior exactly as it was before tracking existed.
#
# The first three SEED NEW STREAMS ONLY -- they are merged into the PipelineConfig the two REST
# start-stream endpoints build, and never reach into a stream that is already running (a running
# stream's tracking config is its own state, changed only by PATCH /api/streams/{id}/config).
# Restart a stream to pick up a changed default; that is deliberate, not a limitation.
#
# Mode new streams start in: OFF | ASSOCIATE | FOLLOW. Defaults to ASSOCIATE (wave T8), matching
# the domain's own PipelineConfig.defaults(): every detection gets a stable id across frames, for
# ~0.8 ms/frame against a ~23 ms detector pass. Set OFF for the pre-tracking behavior byte-for-byte
# -- no track ids, no tracker, an unchanged wire payload. FOLLOW holds one locked target per frame
# and duty-cycles the detector down to a periodic verify pass; it is normally reached per stream by
# clicking a box, not by starting every stream locked.
# vision.tracking.default-mode=ASSOCIATE
# The JAVA-side sampler's target frame rate while FOLLOW is active (docs/TRACKING-PLAN.md 5.D):
# the tracker wants frames faster than vision.application.pipeline's inference rate. 15 rather
# than "every frame" on purpose -- ~1.2 MB/s per stream, which survives a VPN link, for a tracker
# that gains little from more samples at typical target speeds. cv-service has no such knob: it
# must never care how often it is fed.
# vision.tracking.follow-fps=15
# FOLLOW's detector re-verify cadence in milliseconds -- how often a full detector pass re-approves
# and re-anchors the tracked box. Raising it lowers CPU and raises drift.
# vision.tracking.verify-every-millis=2000
#
# The last two configure the per-stream READ MODELS (vision-application's TrackingStatsWindow and
# TrackBook, via StreamPipelineSettings), so unlike the seeds above they apply to every stream this
# instance starts from then on.
#
# How far back the duty-cycle counters reach -- what GET /api/streams/{id}/tracks reports as
# stats.windowSeconds and what the cockpit's flow strip is computed over.
# vision.tracking.stats-window-seconds=30
# How long a track that stops arriving stays in the track book before expiring.
# vision.tracking.track-retention-seconds=5
#
# The remaining wire knobs of the tracking contract (redetect IoU, max age frames, min hits) have
# no key here on purpose: they are resolved inside cv-service from CV_TRACK_IOU / CV_TRACK_MAX_AGE /
# CV_TRACK_MIN_HITS, and duplicating them would give one number two owners. The engine roster
# GET /api/cv/trackers serves is a static in-source list (TrackingWiring#cvTrackerRoster), exactly
# like GET /api/cv/models'.

# --- Device discovery (see docs/DISCOVERY-PLAN.md Task D4) -------------------
# Whether DiscoveryWiringConfiguration registers the discovery scanner beans
# (adapter-discovery: ONVIF WS-Discovery, mDNS, V4L2 enumeration). When
# false, POST /api/discovery/scan still works but degrades to an empty
# result (no scanners registered) -- useful in restricted environments
# without multicast/network access or a /dev tree to enumerate.
vision.discovery.enabled=true
# UDP port MavlinkHeartbeatScanner listens on for MAVLink heartbeats -- the
# well-known GCS port every telemetry radio/SITL pushes to by default. Also
# echoed as GET /api/system/network's mavlinkPort field (docs/DRONE-INFRA-PLAN.md
# I-g) so the onboarding wizard's generated snippets can never target a
# different port than the scanner actually listens on. Commented out here to
# document the default rather than override it.
# vision.discovery.mavlink-port=14550
# MdnsScanner's scan-timing budget (docs/LAYERING-REFACTOR-PLAN.md §2.2, wave F4) -- cushions carved
# out of a caller-requested scan window; changing these changes scan-timing behavior
# (MdnsScannerLoopbackTest and DefaultDiscoveryService's own 200ms caller grace are coupled to them).
# vision.discovery.mdns.join-grace=150ms
# vision.discovery.mdns.safety-margin=50ms
# vision.discovery.mdns.min-list-window=50ms
# V4l2Scanner's filesystem bases -- only ever overridden in tests.
# vision.discovery.v4l2.dev-base=/dev
# vision.discovery.v4l2.sys-base=/sys

# --- Fleet persistence (see docs/MVP2-PLAN.md P-a) ----------------------------
# Whether PersistenceWiringConfiguration wires CategoryRepositoryPort/
# DeviceRepositoryPort/AssetRepositoryPort to adapter-persistence's JPA/
# Postgres implementations (migrated with Flyway on first use). When false
# (default), those ports stay the devsupport in-memory fallbacks -- today's
# behavior, no database required to run this app or its tests.
vision.persistence.enabled=false
# JDBC URL/credentials of the Postgres database. Only read when
# vision.persistence.enabled=true. Defaults match docker-compose.yml's
# postgres service on its host-mapped port; docker-compose overrides these
# for vision-app's own container to address the compose-internal hostname
# instead (see VISION_PERSISTENCE_JDBC_URL there).
vision.persistence.jdbc-url=jdbc:postgresql://localhost:5432/vision
vision.persistence.username=vision
vision.persistence.password=vision

# --- Server-push data plane (see docs/REALTIME-PLAN.md §4) -------------------
# Whether WiringConfiguration wires LiveUpdatePublisherPort to the real
# vision-api LiveUpdateRegistry (which also backs GET /api/live). When false,
# /api/live 404s (its controller/registry beans are conditionally absent
# entirely) and the port falls back to a no-op -- steady-state polling is the
# only way to observe fleet/telemetry/detections/event changes in that case.
vision.live.enabled=true

# --- Simulated-feed resume-on-boot (SimulationService#resumeAll) -------------
# Whether SimulationResumeRunner calls SimulationService#resumeAll() once at
# boot, restarting the TX feed for every persisted simulated asset whose rtsp
# video device is one of this app's own TX-fed feeds (fixes "frozen video"
# after a restart -- see DefaultSimulationService#resumeAll's own javadoc).
# Only takes effect when vision.persistence.enabled=true too -- the
# in-memory profile has nothing to resume after a restart either, since its
# assets are gone at the same restart.
vision.simulation.resume-on-boot=true
# SimulatedVideoSource's default frame width/height/fps (docs/LAYERING-REFACTOR-PLAN.md §2.2, wave F4).
# vision.simulation.video.width=640
# vision.simulation.video.height=480
# vision.simulation.video.fps=15
# SimulatedTelemetrySource's default circular-track center/radius/cadence/battery-drain.
# vision.simulation.telemetry.center-latitude=50.45
# vision.simulation.telemetry.center-longitude=30.52
# vision.simulation.telemetry.track-radius-meters=200
# vision.simulation.telemetry.period=1s
# vision.simulation.telemetry.battery-drain-percent-per-second=0.05

# --- Session auth (docs/U-AUTH-PLAN.md wave 3) ------------------------------
# false (default): NOTHING is secured -- the Spring Security filter chain is
# permit-all + CSRF-off, so every existing test and the running SPA behave
# exactly as before auth existed; CurrentUser returns the fixed dev principal
# (auto-admin) and /api/auth/* report that dev admin with authEnabled=false.
# true: a session is required for /api/** except /api/auth/login|logout and
# static/SPA routes; the three seeded users (admin/admin, manager/manager,
# pilot/pilot -- DEV-ONLY passwords, see AuthSeedRunner) can log in. Seeding
# runs regardless of this flag (so flipping it on has accounts to use), but is
# a no-op once any user exists.
vision.auth.enabled=false

# --- RC manual-control relay (docs/RC-CONTROL-PHASE1-PLAN.md, RC-CONTROL Phase 1) ---------------
# Input-loss watchdog timeout (milliseconds) for a /ws/manual-control relay session: a session
# with no "channels" frame for this long auto-releases (WiringConfiguration#manualControlService,
# ManualControlWebSocketHandler). SITL-tune this against the measured glass-to-stick latency
# (docs/RC-CONTROL-PHASE1-PLAN.md's SITL verification steps 6-7) before relying on it. Commented
# out here to document the default rather than override it.
# vision.rc.watchdog-timeout-ms=300
# MavlinkManualControlSender's RC_CHANNELS_OVERRIDE cadence (docs/LAYERING-REFACTOR-PLAN.md §2.2,
# wave F2) -- replaces the VISION_RC_OVERRIDE_HZ/VISION_RC_RELEASE_FRAMES environment variables that
# used to be the only place in the repo bypassing Spring config entirely.
# vision.rc.override-hz=33
# vision.rc.min-override-hz=10
# vision.rc.max-override-hz=50
# vision.rc.release-frames=3

# --- CV model-improvement training loop (docs/CV-TRAINING-PLAN.md, Wave T4; delta docs/CV-TRAINING-V2-PLAN.md) --
# false (default): DatasetController/LabelingController/TrainingJobController and every training
# bean (DatasetService/LabelingService/TrainingStores/DatasetUploadPort) are entirely absent from
# the context -- /api/datasets, /api/streams/{id}/samples, /api/usages/{id}/samples,
# /api/samples/{id}/*, and /api/datasets/{id}/train all 404 like any other unmapped route, exactly
# as before this feature existed. true: wires the capture -> label -> train pipeline
# (TrainingWiringConfiguration); training kicks off a gRPC dataset upload to cv-service, no
# on-disk export artifact is ever written.
vision.training.enabled=false

