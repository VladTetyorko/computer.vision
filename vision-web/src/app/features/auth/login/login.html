<div class="login-shell">
  <form class="card login-card" (ngSubmit)="submit()">
    <div class="login-brand">
      <span class="login-brand-mark" aria-hidden="true"></span>
      <span>Vision</span>
    </div>

    <div>
      <h1>Sign in</h1>
      <p class="muted">Enter your Vision credentials to continue.</p>
    </div>

    <label class="login-field">
      <span class="label">Username</span>
      <input
        type="text"
        name="username"
        autocomplete="username"
        autocapitalize="none"
        [ngModel]="facade.username()"
        (ngModelChange)="facade.username.set($event)"
        [disabled]="facade.busy()"
        required
      />
    </label>

    <label class="login-field">
      <span class="label">Password</span>
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        [ngModel]="facade.password()"
        (ngModelChange)="facade.password.set($event)"
        [disabled]="facade.busy()"
        required
      />
    </label>

    @if (facade.error(); as error) {
      <vision-notice variant="danger">{{ error }}</vision-notice>
    }

    <button type="submit" class="btn login-submit" [disabled]="!facade.canSubmit()">
      {{ facade.busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
