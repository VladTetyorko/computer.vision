<div class="login-shell">
  <form class="card login-card" (ngSubmit)="submit()">
    <div class="login-brand">
      <span class="login-brand-mark" aria-hidden="true"></span>
      <span>Vision</span>
    </div>

    <div>
      <h1>Sign in</h1>
      <p class="muted">Enter your Vision credentials to continue.</p>
    </div>

    <label class="login-field">
      <span class="label">Username</span>
      <input
        type="text"
        name="username"
        autocomplete="username"
        autocapitalize="none"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        [disabled]="busy()"
        required
      />
    </label>

    <label class="login-field">
      <span class="label">Password</span>
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [disabled]="busy()"
        required
      />
    </label>

    @if (error(); as error) {
      <p class="login-error" role="alert">{{ error }}</p>
    }

    <button type="submit" class="btn login-submit" [disabled]="!canSubmit()">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
