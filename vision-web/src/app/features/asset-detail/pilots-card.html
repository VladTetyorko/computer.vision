@if (canManage()) {
  <vision-section-header title="Pilots" subtitle="Who may fly this asset" />

  <div class="pilots-add">
    <select
      aria-label="Add a pilot"
      [ngModel]="pickUserId()"
      (ngModelChange)="pickUserId.set($event)"
      [disabled]="busy() || assignable().length === 0"
    >
      <option value="">{{ assignable().length === 0 ? 'No more users to add' : 'Choose a user…' }}</option>
      @for (user of assignable(); track user.userId) {
        <option [value]="user.userId">{{ user.displayName }} ({{ user.username }})</option>
      }
    </select>
    <button type="button" class="btn" (click)="add()" [disabled]="busy() || !pickUserId()">Add pilot</button>
  </div>

  @if (loading() && assigned().length === 0) {
    <p class="muted">Loading…</p>
  } @else if (assigned().length === 0) {
    <vision-empty title="No pilots assigned" message="Add a pilot above so they can fly this asset from their cockpit." />
  } @else {
    <ul class="pilots-list">
      @for (pilot of assigned(); track pilot.userId) {
        <li class="pilots-row">
          <span class="pilots-name truncate">{{ pilot.displayName }}</span>
          <button type="button" class="btn danger small" (click)="remove(pilot.userId)" [disabled]="busy()">
            Remove
          </button>
        </li>
      }
    </ul>
  }
}
