<details class="bell" #bell (toggle)="onToggle(bell.open)">
  <summary
    class="bell-trigger"
    aria-label="Notifications"
    [title]="unreadCount() > 0 ? unreadCount() + ' unread event' + (unreadCount() === 1 ? '' : 's') : 'Notifications'"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6" />
      <path d="M10 20a2 2 0 0 0 4 0" />
    </svg>
    @if (unreadCount() > 0) {
      <span class="bell-badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
  </summary>

  @if (bell.open) {
    <vision-events-rail class="bell-dropdown" (open)="onRailOpen($event, bell)" />
  }
</details>
