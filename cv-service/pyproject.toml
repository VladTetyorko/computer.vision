[project]
name = "cv-service"
version = "0.1.0"
description = "Python CV inference & training gRPC service for the Vision platform (see ../ARCHITECTURE.md, ../docs/PHASE0-PLAN.md)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.64.0,<2",
    "grpcio-tools>=1.64.0,<2",
    "protobuf>=5.26.1,<6",
]

[project.optional-dependencies]
# Phase 2: real inference backend (Ultralytics YOLO) + frame decoding.
cv = [
    "ultralytics",
    "opencv-python-headless",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_service"]
