[project]
name = "cv-service"
version = "0.1.0"
description = "Python CV inference & training gRPC service for the Vision platform (see ../ARCHITECTURE.md, ../docs/PHASE0-PLAN.md)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.64.0,<2",
    "grpcio-tools>=1.64.0,<2",
    "protobuf>=5.26.1,<6",
]

[project.optional-dependencies]
# Phase 2: real inference backend (Ultralytics YOLO) + frame decoding, and
# (docs/TRACKING-PLAN.md wave T1) the tracking engines.
#
# `ultralytics` pulls in `torch` transitively; this service targets CPU-only
# inference, so on x86 install with the PyTorch CPU wheel index to avoid
# pulling multi-GB CUDA-bundled torch builds, e.g.:
#   pip install -e '.[cv]' --extra-index-url https://download.pytorch.org/whl/cpu
# (see Dockerfile, which uses the same index). Ultralytics/torch will still
# use a GPU automatically if one happens to be present and the CUDA build is
# installed instead -- nothing here requires CPU-only, it's just the
# default/documented path for the demo target (a laptop, no GPU assumed).
#
# THE --extra-index-url LINE IS x86-ONLY. On aarch64 (a Raspberry Pi / any
# ARM companion computer, docs/TRACKING-PLAN.md §3.3) PyPI's plain `torch`
# wheel already IS the CPU build -- there are no generic-ARM CUDA wheels --
# so the ARM install line is simply `pip install -e '.[cv]'`. See
# cv-service/MODULE.md, "Running on ARM64 / a companion computer".
#
# INVARIANT P1 (docs/TRACKING-PLAN.md §3.3, §5.J): NOTHING x86-ONLY OR
# CUDA-ONLY MAY EVER ENTER THIS EXTRA. It is what makes the same cv-service
# package deployable to a laptop, to the GB4005 LAN box, and onboard an
# airframe. It is free to hold and expensive to recover: one CUDA-gated
# dependency, or `openvino` promoted out of the Dockerfile and into here,
# silently ends the onboard story. Every shipped tracker engine is therefore
# pure core-OpenCV (`lk`, `ncc`) or pure Python over numpy (`bytetrack`).
# Every pin below was verified to have a real aarch64 wheel by downloading
# it, not by reading a compatibility table -- the command and its output are
# recorded in cv-service/MODULE.md.
#
# NOTE: don't add opencv-python-headless here even though we'd prefer it --
# ultralytics hard-depends on plain `opencv-python` (the GUI-enabled build),
# and pip has no notion that the two packages both provide `cv2` and
# conflict; installing both leaves whichever installed last silently
# overwriting the other's `cv2` files on disk. Satisfy plain opencv-python's
# runtime shared-library needs at the OS level instead (see Dockerfile:
# libgl1/libglib2.0-0).
#
# `opencv-python` is pinned to a MAJOR RANGE (docs/TRACKING-PLAN.md R3):
# before T1 this floated transitively from ultralytics and happened to land
# on 5.0.x. That is not a detail we can float on -- OpenCV 5 REMOVED
# `TrackerKCF`/`TrackerCSRT`/`TrackerMOSSE` and dropped `cv2.legacy`
# entirely, so a rebuild landing on a different major would change which
# tracker APIs exist at all. `TrackerRegistry` still probes constructibility
# at startup rather than trusting this pin (a pin says what pip installs, a
# probe says what actually works on this box).
#
# `lap` is pinned because it is a HIDDEN RUNTIME dependency of ultralytics'
# `BYTETracker.update` -> `matching.linear_assignment`, which ultralytics'
# AutoUpdate resolves by running `pip install lap` FROM THE NETWORK,
# MID-PROCESS, inside a live stream (docs/TRACKING-PLAN.md R2, observed).
# On the offline GB4005 box, in a running container, or on a companion
# computer in flight, that is not an annoyance -- it is a guaranteed
# in-flight failure with no fallback. Pinning it makes the dependency
# explicit and the install deterministic.
cv = [
    "ultralytics",
    "opencv-python>=5.0,<6",
    "lap>=0.5.12",
]
# Test-only dependencies (not needed to run the service itself).
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
