syntax = "proto3";

// Java <-> Python contract for the CV service (see ARCHITECTURE.md §1, §4 and
// docs/plans/done/PHASE0-PLAN.md §4 Task T3). This is the single source of truth for both
// the vision-proto (Java/grpc-java) and cv-service (Python/grpcio) codegen.
package vision.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.drones.vision.proto.v1";

// Wire encoding of the pixel data carried in a FrameRequest.
enum ImageEncoding {
  IMAGE_ENCODING_UNSPECIFIED = 0;
  IMAGE_ENCODING_JPEG = 1;
  IMAGE_ENCODING_BGR24 = 2;
}

// ---------------------------------------------------------------- NEW enums

// How the two perception loops cooperate for one stream (docs/plans/done/TRACKING-PLAN.md §3).
enum TrackingMode {
  TRACKING_MODE_UNSPECIFIED = 0;  // old client / not stated -> treated as OFF
  TRACKING_MODE_OFF         = 1;  // detector only, no track ids -- byte-identical to pre-tracking
  TRACKING_MODE_ASSOCIATE   = 2;  // Mode A: associate every detection across frames
  TRACKING_MODE_FOLLOW      = 3;  // Mode B: per-frame visual tracker, detector duty-cycled
}

// Lifecycle state of the track a Detection belongs to.
enum TrackState {
  TRACK_STATE_UNSPECIFIED = 0;  // no tracking ran for this detection
  TRACK_STATE_TENTATIVE   = 1;  // born, below min_hits -- not yet a stable identity
  TRACK_STATE_CONFIRMED   = 2;  // confirmed by the detector on this or a recent pass
  TRACK_STATE_COASTING    = 3;  // tracker-predicted; detector has not re-confirmed yet
  TRACK_STATE_LOST        = 4;  // unmatched past max_age_frames; kept alive for re-acquisition
}

// Which loop produced this particular box on this particular frame.
enum DetectionSource {
  DETECTION_SOURCE_UNSPECIFIED = 0;  // old server / not stated
  DETECTION_SOURCE_DETECTOR    = 1;  // a full detector pass ran on this frame and produced this box
  DETECTION_SOURCE_TRACKER     = 2;  // the per-frame visual tracker produced this box
}

// -------------------------------------------------------------- NEW messages

// WHY a detector pass was spent on this frame. `detector_ran` says whether; this says why.
// Values match the trigger list of §3.1 one-for-one. See TRACKING-ORCHESTRATION.md §5.1 --
// without this, "why is my detector still running in FOLLOW mode?" is answerable only by
// reading cv-service logs, which on a flying companion computer is not answerable at all.
enum DetectorReason {
  DETECTOR_REASON_UNSPECIFIED    = 0;  // old server, or no detector pass ran on this frame
  DETECTOR_REASON_ALWAYS         = 1;  // mode OFF/ASSOCIATE -- every received frame gets a pass
  DETECTOR_REASON_CADENCE        = 2;  // (a) verify_every_millis elapsed
  DETECTOR_REASON_TRACKER_FAILED = 3;  // (b) tracker reported failure / sub-threshold confidence
  DETECTOR_REASON_NO_LOCK        = 4;  // (c) no lock held -- re-acquire
  DETECTOR_REASON_BOX_INVALID    = 5;  // (d) predicted box left the frame or collapsed
  DETECTOR_REASON_COASTED_OUT    = 6;  // (e) COASTING longer than max_age_frames
}

// Camera attitude at capture time (docs/plans/done/TRACKING-V2-PLAN.md §2).
//
// Feeds two consumers that need the same numbers: ego-motion compensation, which warps a track's
// predicted box into the current frame before any IoU is computed (without it, a yawing aircraft
// charges its own movement to the object and the track is reborn every slew), and, later, S2
// fixed-camera geolocation.
//
// Every field is optional. `hfov_degrees == 0` means "unknown" and is the one field that gates the
// whole message: with no FOV an attitude delta cannot be converted to a pixel shift, so cv-service
// reports the pose compensator unavailable and degrades to flow-based estimation. An absent
// CameraPose is therefore never an error -- it is the normal state of a client that has not been
// taught to send one.
message CameraPose {
  float yaw_degrees           = 1;  // camera boresight heading, degrees
  float pitch_degrees         = 2;  // positive up
  float roll_degrees          = 3;
  float hfov_degrees          = 4;  // 0 = unknown -> pose compensation disabled for this stream
  float vfov_degrees          = 5;  // 0 = derive from hfov and the frame aspect ratio
  int64 pose_timestamp_millis = 6;  // 0 = the same instant as the frame
}

// Which object FOLLOW mode should hold.
//
// Identified by `lock_seq`: cv-service applies a lock only when `lock_seq` is strictly
// greater than the last one it applied for this stream. Restating the identical lock on
// every frame is therefore idempotent -- which is REQUIRED, see TrackingConfig below.
message TargetLock {
  int64 lock_seq  = 1;  // monotonic per stream; 0 = no lock has ever been issued
  int64 track_id  = 2;  // lock onto an existing track; 0 = use point/box instead
  float point_x   = 3;  // normalized [0,1] click point, used when track_id == 0
  float point_y   = 4;
  // DEPRECATED by CV-ORCHESTRATION W1 (§4.5, E14): unreachable from this codebase by design --
  // the REST PATCH surface only ever accepted trackId/point/release, so the Java codec
  // deliberately never sets it (R4 surprise 4). Kept, never renumbered: the server still honours
  // it if some other client ever sends one.
  BoundingBox box = 5;  // DEPRECATED -- optional explicit box; unset -> server default around the point
  bool  release   = 6;  // true = drop the current lock, fall back to the config's mode policy
}

// Declarative per-stream tracking state, restated on EVERY FrameRequest.
//
// Deliberately declarative, never an imperative one-shot control message: cv-service's
// LatestOnlyMailbox silently DROPS a frame when the sender gets ahead of the consumer
// (cv-service/MODULE.md, "LatestOnlyMailbox drops a frame with no response at all"), so a
// one-shot control message could be lost with no error and no retry. A restated desired
// state is self-healing -- the next frame carries it again.
message TrackingConfig {
  TrackingMode mode             = 1;
  string       engine_id        = 2;  // "" = server default for the mode
  int32  verify_every_millis    = 3;  // FOLLOW detector re-verify cadence; <=0 = server default (2000)
  float  redetect_iou_threshold = 4;  // re-anchor when detector<->tracker IoU >= this; <=0 = default (0.3)
  int32  max_age_frames         = 5;  // unmatched frames before LOST;      <=0 = default (30)
  int32  min_hits               = 6;  // detector hits TENTATIVE -> CONFIRMED; <=0 = default (3)
  TargetLock lock               = 7;  // FOLLOW only; absent = no lock held
  // DEPRECATED by CV-ORCHESTRATION W1 (§4.5, E14). Fields 8-10 have no domain field, no REST
  // field and no UI control anywhere in the stack (R4 surprise 3) -- nothing has ever set them
  // to a non-default value. Never renumbered and never removed: cv-service still reads them, so
  // a future caller that wants one costs nothing. Their INFORMATION now lives in the ledger
  // (`SessionFacts.motion_engine_id`/`.appearance_engine_id`, `LedgerEntry.summary`), which is
  // where a served engine belongs -- a request field can only ever say what was asked for.
  string motion_engine_id       = 8;  // DEPRECATED -- see above
  string appearance_engine_id   = 9;  // DEPRECATED -- see above
  int32  memory_ttl_millis      = 10; // DEPRECATED -- see above
  // TRACKING-V3-PLAN wave V1 -- the capability ladder (§5). 0 = auto-probe: cv-service
  // decides the highest level this host affords. 1-5 = an explicit CEILING (decision
  // E12): the session serves min(requested, affordable), never more, never a refusal.
  int32  capability_level       = 11;
  // Field numbers 12-13 are reserved for a later V3 wave (history_size, momentum_span_frames).
  // TRACKING-V3-PLAN wave V3 -- ORU (§4.2). Longest gap, in milliseconds, cv-service will
  // reconstruct from the two real observations bracketing it; <=0 = server default.
  int32  reupdate_max_gap_millis = 14;
}

// -------------------------------------------------------- MEDIA-SOT-PLAN wave M1

// Declarative per-pull desired state, restated on EVERY PullControl message -- same doctrine as
// TrackingConfig above, and for the same reason: a one-shot control message can be lost with no
// error and no retry, so a restated desired state is self-healing. `source_url` and
// `rtsp_transport` are read from the FIRST message of the call only; every other field is hot and
// takes effect as soon as the worker sees it (docs/plans/done/MEDIA-SOT-PLAN.md §5.1).
message PullControl {
  string stream_id            = 1;   // vision StreamId; ALSO the mediamtx path name (D2)
  string source_url           = 2;   // rtsp://{host}:8554/{stream_id} -- read from the FIRST message only
  string rtsp_transport       = 3;   // "tcp" | "udp" | "" = server default; first message only
  string model_id             = 4;   // hot
  string model_version        = 5;   // hot
  float  confidence_threshold = 6;   // hot
  float  target_fps           = 7;   // hot; <=0 = server default. The Java rate controller's output
  int32  detect_width         = 8;   // hot; <=0 = server default. Worker downscales locally
  TrackingConfig tracking     = 9;   // hot; reused verbatim, including TargetLock/lock_seq semantics
  CameraPose camera_pose      = 10;  // hot; arrives at telemetry rate, decoupled from frames
  bool   stop                 = 11;  // true = drain and half-close cleanly
  bool   trace                = 12;  // NEW (W1) -- hot; see FrameRequest.trace
}

// ---------------------------------------------------------- CHANGED messages

// A single frame sent to the CV service for inference, plus which model to
// run it against.
message FrameRequest {
  string stream_id             = 1;
  int64 sequence               = 2;
  int64 timestamp_millis       = 3;
  int32 width                  = 4;
  int32 height                 = 5;
  ImageEncoding encoding       = 6;
  bytes data                   = 7;
  string model_id              = 8;
  string model_version         = 9;
  float confidence_threshold   = 10;
  TrackingConfig tracking      = 11;  // NEW -- absent => TRACKING_MODE_OFF
  CameraPose camera_pose       = 12;  // NEW -- absent => flow-based ego-motion compensation only
  // CV-ORCHESTRATION wave W1 -- demand for the warm trace tier (§4.4). `true` attaches this
  // frame's `FrameLedger` to the response; `false` (the default, and every call site today)
  // leaves the response byte-identical to what it is without this field. Restated on EVERY
  // request like the rest of this message's desired state, so demand appearing or disappearing
  // is self-healing rather than a one-shot that can be dropped.
  bool trace                   = 13;  // NEW
}

// Normalized bounding box. Coordinates are in [0, 1] relative to frame
// width/height, origin at the TOP-LEFT of the frame: (x, y) is the top-left
// corner of the box, and the box extends right by `width` and down by
// `height` (i.e. the box occupies [x, x+width] x [y, y+height]).
message BoundingBox {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message Detection {
  string label            = 1;
  float confidence        = 2;
  BoundingBox box         = 3;
  int64 track_id          = 4;  // NEW -- 0 = untracked. Real ids start at 1, per stream.
  TrackState track_state  = 5;  // NEW
  DetectionSource source  = 6;  // NEW
  float velocity_x        = 7;  // NEW -- normalized frame-WIDTHS per second (matches BoundingBox units)
  float velocity_y        = 8;  // NEW -- normalized frame-HEIGHTS per second
  int32 track_age_frames  = 9;  // NEW -- frames since this track was born
  float identity_confidence = 10; // NEW -- >0 => this id was RECOVERED from memory, at this score; 0 => not a recovery
  int64 dormant_millis      = 11; // NEW -- how long this identity was dormant before it was recovered; 0 => not a recovery
  // Field numbers 12-13 are reserved for a later wave (coast_millis, motion_confidence).
  // TRACKING-V3-PLAN wave V3 -- ORU (§4.2).
  bool  reupdated           = 14; // NEW -- true => this track's gap was reconstructed by ORU this frame
}

// Inference result for one frame.
message DetectionResponse {
  string stream_id             = 1;
  int64 sequence               = 2;
  int64 timestamp_millis       = 3;
  string model_id              = 4;
  string model_version         = 5;
  repeated Detection detections = 6;
  int64 inference_millis       = 7;
  int64 tracker_millis         = 8;   // NEW -- per-frame tracker cost; 0 when no tracker ran
  bool  detector_ran           = 9;   // NEW -- false => this frame was tracker-only (duty-cycled)
  string tracker_engine_id     = 10;  // NEW -- engine that actually served this frame ("" = none)
  int64 locked_track_id        = 11;  // NEW -- FOLLOW: the track currently held (0 = none)
  DetectorReason detector_reason = 12; // NEW -- why the pass ran; UNSPECIFIED when it did not
  // DEPRECATED by CV-ORCHESTRATION W1 (§4.5, E14). All three are populated by cv-service and
  // read by NOBODY: the Java codec has zero call sites for any of them (R4 surprise 1), so the
  // whole ego-motion story is computed and discarded end to end. Never renumbered, never removed.
  // Their information is now a ledger fact per frame (`egomotion.*`'s `LedgerEntry.cost_ms` and
  // summary, `detect.roi`'s own entry) -- which is also where the ROI pass stops hiding inside
  // `tracker_millis` (R3 surprise 4).
  bool   detector_roi      = 13;  // DEPRECATED -- see above
  int64  motion_millis     = 14;  // DEPRECATED -- see above
  string motion_engine_id  = 15;  // DEPRECATED -- see above

  // Pull mode (DetectPulled). Zero in push mode, with ONE exception since CV-ORCHESTRATION wave
  // W0: `dropped_frames` (19) is now also filled under DetectStream, from the latest-wins mailbox
  // that already counted them (`LatestOnlyMailbox.dropped`) -- same field, same cumulative meaning,
  // and the only number that distinguishes "this worker could not keep up" from a Java-side
  // sampling decision. Together these are the complete, honest accounting of a decode-and-infer
  // loop that now runs on another machine, where the usual per-request round trip can no longer
  // tell an operator what happened (MEDIA-SOT-PLAN §5.1, §7).
  // `dropped_frames` (19) counts only frames the loop genuinely could not keep up with -- a served
  // frame superseded while still out for inference, or backlog thrown away because the detector was
  // busy (D8). It excludes frames the deadline sampler never selected because the source simply
  // outran target_fps: that is downsampling working as designed, not a drop, and is already visible
  // as the gap between `source_fps` and `achieved_fps` (docs/conclusions/MEDIA-SOT-RESULTS.md §6).
  int64 decode_millis       = 16;  // NEW -- local decode cost for the frame this response describes
  float source_fps          = 17;  // NEW -- measured rate of the pulled stream
  float achieved_fps        = 18;  // NEW -- measured rate at which this loop actually infers
  int64 dropped_frames      = 19;  // NEW -- cumulative frames genuinely dropped, not merely unselected (D8)
  int64 missed_deadlines    = 20;  // NEW -- cumulative sampler deadlines no frame arrived to serve
  // DEPRECATED by CV-ORCHESTRATION W1 (§4.5, E14): decoded into `PullTelemetry` and consumed by
  // no JSON DTO on any surface (R4 surprise 7). Kept and never renumbered; the honest home for a
  // per-frame timing fact is the ledger.
  int64 capture_skew_millis = 21;  // DEPRECATED -- worker's estimate of (local receipt - capture)

  // TRACKING-V3-PLAN wave V3 -- ORU (§4.2).
  int64  reupdate_millis    = 22; // NEW -- ORU cost this frame, milliseconds; 0 = none ran
  int32  reupdated_tracks   = 23; // NEW -- tracks backfilled by ORU this frame
  // TRACKING-V3-PLAN wave V6 -- late-detection back-correction (§4.5): ORU applied
  // per-detection, binding a detection to its own capture time rather than "now".
  int64  detection_lag_millis = 24; // NEW -- measured capture -> association lag; 0 = unknown

  // TRACKING-V3-PLAN wave V1 -- the capability ladder (§5).
  int32  capability_level_served = 25; // NEW -- level that ACTUALLY ran; always <= requested
  string capability_level_reason = 26; // NEW -- why it was capped; "" = served as requested

  // CV-ORCHESTRATION wave W1 (§4.5) -- the mirror, and the trace it was produced by.
  // `objects` carries one entry per LIVE and per DORMANT identity of this frame, which is a
  // different set from `detections`: a coasting track with no detection this frame is here and
  // not there, and a dormant identity is here and has never been anywhere. `detections` is
  // unchanged, byte for byte, and remains the contract every existing reader is written against.
  repeated ObjectState objects = 27;
  // Present ONLY while the request asked for it (`FrameRequest.trace` / `PullControl.trace`).
  // Zero cost when nobody looks: the ring is filled either way, but nothing serializes it.
  FrameLedger ledger           = 28;
}

message TrainingJobSpec {
  string base_model = 1;
  string dataset_id = 2;
  int32 epochs = 3;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  RUNNING = 1;
  SUCCEEDED = 2;
  FAILED = 3;
}

message TrainingProgress {
  string job_id = 1;
  int32 epoch = 2;
  int32 total_epochs = 3;
  float loss = 4;
  float map50 = 5;
  JobState state = 6;
  string message = 7;
}

message ModelInfo {
  string id = 1;
  string version = 2;
  string stage = 3;
  map<string, float> metrics = 4;
}

message ModelList {
  repeated ModelInfo models = 1;
}

message ModelRefMsg {
  string id = 1;
  string version = 2;
}

message Ack {
  bool ok = 1;
  string message = 2;
}

// One slice of an uploaded YOLO dataset archive (docs/plans/done/CV-TRAINING-V2-PLAN.md §1). The
// concatenation of every chunk's `content`, in stream order, is a ZIP file carrying exactly the
// layout docs/plans/done/CV-TRAINING-PLAN.md §5 freezes: `data.yaml`, `images/<name>`, `labels/<stem>.txt`.
message DatasetChunk {
  string dataset_id = 1;   // set on EVERY chunk; must be identical throughout the stream
  bytes  content    = 2;   // next slice of the archive
}

message UploadAck {
  bool   ok             = 1;
  string message        = 2;
  string dataset_id     = 3;
  int64  bytes_received = 4;
  int32  file_count     = 5;   // files extracted, incl. data.yaml
}

// ---- CV-ORCHESTRATION wave W0 (docs/plans/active/CV-ORCHESTRATION-PLAN.md §4.4) -------------
// A read-only debug surface. Purely ADDITIVE: nothing on the DetectStream/DetectPulled response
// path changes, no existing message gains a field, and no existing enum gains a value (Java's
// exhaustive switches, plan §4.5). A client that never calls Inspect cannot tell this exists.

// What happened to one contributor on one frame.
enum LedgerOutcome {
  LEDGER_OUTCOME_UNSPECIFIED = 0;
  LEDGER_OUTCOME_RAN         = 1;  // it ran and produced whatever it produces
  LEDGER_OUTCOME_SKIPPED     = 2;  // the budget refused it, or it declined itself -- `reason` says
  LEDGER_OUTCOME_FAILED      = 3;  // it raised; the frame continued without its output
}

// One contributor's row on one frame. `cost_ms` is the contributor's OWN measurement when it has
// one that reaches the wire (the detector's inference_millis, ego-motion's motion_millis) and the
// orchestrator's wall clock otherwise -- the two are never summed into a single "total".
message LedgerEntry {
  string        contributor_id = 1;   // "detect.full", "assoc.cost", "follow.lk", ...
  LedgerOutcome outcome        = 2;
  string        reason         = 3;   // why it was skipped, or "<ExcType>: <message>" when it failed
  double        cost_ms        = 4;
  map<string, string> summary  = 5;   // free-form facts this contributor chose to record
}

// One claim ONE contributor made about ONE object, kept attributed rather than merged: "who said
// this" is the question a merged map cannot answer.
message ObjectEvidence {
  string contributor_id       = 1;
  map<string, string> claim   = 2;
}

// Every claim made about one track id on one frame.
message ObjectClaims {
  repeated ObjectEvidence claims = 1;
}

// One raw detector box before association -- the wire-shaped facts trackeval's own
// RecordedDetection keeps. Deliberately NOT `Detection`: that message's track fields would let
// the tracker's own output back into a fixture meant to test the tracker against real detector
// noise (CV-ORCHESTRATION wave W5b, decision E23).
message TracedDetection {
  string      label      = 1;
  float       confidence = 2;
  BoundingBox box        = 3;
}

// One frame's complete evidence. Bounded and in-memory (CV_LEDGER_RING frames per session);
// never persisted, never pushed -- a client asks for it or it is forgotten.
message FrameLedger {
  string   stream_id            = 1;
  int64    sequence             = 2;   // this session's own frame counter, from 0
  int64    captured_at_millis   = 3;
  int32    level_served         = 4;   // the capability ladder level this frame actually ran at
  string   detector_reason      = 5;   // DetectorReason's own value name, as the response carries it
  repeated string eligible      = 6;   // contributor FAMILIES the budget allowed this frame
  repeated LedgerEntry entries  = 7;   // in run order
  map<int64, ObjectClaims> objects = 8;  // track id -> what was claimed about it
  int32    drops_since_last     = 9;   // frames the mailbox dropped before this one (push mode)
  double   gate_wait_ms         = 10;  // wall time inside the detector: queueing plus inference
  double   total_ms             = 11;
  bool     halted               = 12;  // a contributor stopped the frame (no model resolved)

  // CV-ORCHESTRATION wave W5b (§4.9 "As built in W5", decision E23). Populated ONLY for a traced
  // request: `detect.full`'s raw per-frame output, before association, in this frame's own
  // normalized coordinates -- never the roi rescue pass's boxes, and never the tracker's own
  // matched/predicted boxes (those already live on `ObjectState.Kinematics`). This is what lets
  // a saved trace replay through `tools/trackeval` against real detector noise instead of the
  // tracker's own prior output.
  repeated TracedDetection detections = 13;
  int32    frame_width           = 14;  // the source frame's width in pixels; 0 = not carried
  int32    frame_height          = 15;  // the source frame's height in pixels; 0 = not carried
}

// What one live tracking session is doing right now.
message SessionFacts {
  string stream_id              = 1;
  string mode                   = 2;   // TrackingMode's own value name
  string engine_id              = 3;   // the associator/follower actually serving, "" when none is
  string motion_engine_id       = 4;
  string appearance_engine_id   = 5;
  int32  level_served           = 6;
  string level_reason           = 7;
  int32  live_tracks            = 8;
  int32  dormant_identities     = 9;
  int64  locked_track_id        = 10;
  int64  frames_processed       = 11;
  repeated string contributors  = 12;  // registered ids, in run order
}

// One entry of a `pool` detector client's ordered target list (CV-ORCHESTRATION W4, §4.9).
// Health is OBSERVED, never probed: these counters are what this process's own calls saw, so
// an unused target reads all-zero rather than claiming to be up.
message DetectorTarget {
  string target      = 1;   // "host:port", or the literal "local" for the in-process detector
  int64  served      = 2;   // passes this target answered
  int64  refused     = 3;   // RESOURCE_EXHAUSTED -- it was up and said no; the caller moved on
  int64  failed      = 4;   // unavailable/timeout/error -- the caller moved on
  string last_error  = 5;   // "" once a call has succeeded since the last failure
}

// What the process as a whole is doing. Cheap enough to answer while streams are running.
message ProcessFacts {
  string detector_client        = 1;   // "local" (in-process) or "pool" (CV_DETECTOR_TARGETS set)
  int32  sessions               = 2;
  int32  gate_permits           = 3;
  int32  ledger_ring            = 4;   // CV_LEDGER_RING: frames retained per session
  repeated string stream_ids    = 5;
  // CV-ORCHESTRATION W4. The local gate's live admission facts -- what a `detector`-role
  // process reports about itself, and what an all-in-one reports about its own in-process
  // detector. `max_queue` is CV_DETECTOR_MAX_QUEUE, the bound above which the `Detector`
  // service answers RESOURCE_EXHAUSTED (0 on a process that serves no Detector service).
  int32  gate_occupancy         = 6;
  int32  gate_queue_depth       = 7;
  int32  gate_max_queue         = 8;
  // Set only on a `pool` client; empty on `local`. Ordered exactly as CV_DETECTOR_TARGETS.
  repeated DetectorTarget detector_targets = 9;
  string role                   = 10;  // CV_SERVICE_ROLE, so "who am I" needs no second call
}

// Empty stream_id: the process and its session list. Otherwise: that session's facts and its
// last `frames` ledgers, newest last.
message InspectRequest {
  string stream_id = 1;
  int32  frames    = 2;   // 0 = the whole ring
}

message InspectResponse {
  ProcessFacts process          = 1;
  SessionFacts session          = 2;   // set only when the request named a stream_id
  repeated FrameLedger ledgers  = 3;
  bool   found                  = 4;   // false when a named stream_id has no live session
}

// ---- CV-ORCHESTRATION wave W1 (docs/plans/active/CV-ORCHESTRATION-PLAN.md §4.5) -------------
// The MIRROR: one message describing one object as this platform currently sees it, so a reader
// no longer has to reconstruct an identity from a box plus eight scalars. Purely ADDITIVE, and
// deliberately so in a way that costs old readers nothing: `detections[]` keeps every byte it has
// today, no existing message loses or renumbers a field, and -- decision E8 -- NO EXISTING ENUM
// GAINS A VALUE. The codec maps `TrackState`/`DetectionSource`/`DetectorReason` with exhaustive
// Java switch EXPRESSIONS that have no `default` branch, so a new value there breaks the build of
// every Java client, and an already-deployed one decodes it as `UNRECOGNIZED` and nulls the whole
// track reference. The mirror therefore brings its own enums, used only by its own messages.

// Where one identity is in its life. `LOST` is the last state today's wire can report; `DORMANT`
// is the one this adds -- a retired identity still held in the per-stream gallery and still
// recoverable under its own number (`cv_service/tracking/memory.py`). Not a value of `TrackState`,
// see the banner above.
enum ObjectLifecycle {
  OBJECT_LIFECYCLE_UNSPECIFIED = 0;
  OBJECT_LIFECYCLE_TENTATIVE   = 1;  // born, below min_hits -- not yet a stable identity
  OBJECT_LIFECYCLE_CONFIRMED   = 2;  // confirmed by the detector on this or a recent pass
  OBJECT_LIFECYCLE_COASTING    = 3;  // tracker-predicted; the detector has not re-confirmed yet
  OBJECT_LIFECYCLE_LOST        = 4;  // unmatched past max_age_frames; kept for re-acquisition
  OBJECT_LIFECYCLE_DORMANT     = 5;  // retired into the gallery; matchable, not currently tracked
}

// What kind of evidence produced THIS frame's view of the object. A superset of `DetectionSource`
// in meaning, a separate enum in fact (E8): `PREDICTED` is a pure coast with no observation at
// all, `MEMORY` is a re-acquisition from the dormant gallery, `REUPDATE` is a box ORU
// reconstructed from the track's own bracketing observations.
enum EvidenceSource {
  EVIDENCE_SOURCE_UNSPECIFIED = 0;
  EVIDENCE_SOURCE_DETECTOR    = 1;
  EVIDENCE_SOURCE_TRACKER     = 2;
  EVIDENCE_SOURCE_PREDICTED   = 3;
  EVIDENCE_SOURCE_MEMORY      = 4;
  EVIDENCE_SOURCE_REUPDATE    = 5;
}

// One object, mirrored. Keyed by `(stream_id, id)` so a later cross-camera fusion stage can
// consume a stream of these with no wire change (E5; fusion itself is out of scope).
//
// Groups are nested messages, not a flat field list, because the alternative is what produced the
// dead scalars this wave deprecates below: every new fact became one more top-level field, and a
// reader could not tell which ones belong together or which are absent versus zero. An absent
// GROUP means "this configuration does not compute these facts at all" (e.g. `kinematics.
// predicted_box` in FOLLOW, where the book is never whole-predicted); a zero FIELD inside a
// present group means the fact is genuinely zero.
//
// Algorithm-shaped facts (the ego-motion transform, appearance descriptors, per-term association
// weights) deliberately do NOT live here -- they are `ObjectEvidence.claim` in the ledger (E7).
// This message describes the OBJECT; the ledger describes the algorithm.
message ObjectState {
  // One entry of the label vote tally behind `Identity.label` -- the distribution, not just the
  // winner (E3), so a training-capture consumer can audit an election it disagrees with.
  message LabelCandidate {
    string label  = 1;
    float  weight = 2;   // decayed, confidence-weighted tally; comparable only within one frame
  }

  // What the object is called, and how settled that name is.
  message Identity {
    string label                       = 1;  // ELECTED -- hysteresis-gated, what an operator reads
    string label_raw                   = 2;  // this frame's own detector label, un-elected
    repeated LabelCandidate candidates = 3;  // the tally behind the election, best-first
    int32  stability                   = 4;  // consecutive elections since `label` last changed
  }

  // Where the object is, and how that was arrived at. Three boxes are kept SEPARATE rather than
  // merged into one "current box" (the DeepStream separation, R5): `box` is the elected one that
  // `detections[]` also carries, and the other three say what each source independently claimed.
  message Kinematics {
    BoundingBox box                = 1;  // the elected box -- identical to the `Detection` box
    BoundingBox detector_box       = 2;  // what the detector claimed this frame; absent if none
    BoundingBox tracker_box        = 3;  // what the single-object tracker claimed; FOLLOW only
    BoundingBox predicted_box      = 4;  // constant-velocity extrapolation to this frame's instant
    int64       horizon_ms         = 5;  // how far `predicted_box` was extrapolated
    float       velocity_x         = 6;  // normalized frame-WIDTHS per second (as `Detection`)
    float       velocity_y         = 7;  // normalized frame-HEIGHTS per second
    float       displacement_x     = 8;  // box-centre delta since the previous update, normalized
    float       displacement_y     = 9;
    bool        motion_compensated = 10; // a non-identity ego-motion transform was applied
  }

  // How strongly the platform believes the object is there at all.
  message Belief {
    float confidence_raw      = 1;  // this frame's own detector confidence
    float confidence_smoothed = 2;  // EMA across this identity's observations
    float existence           = 3;  // [0,1] from hits/misses -- survives a frame with no detection
    int64 since_confirmed_ms  = 4;  // since the last DETECTOR confirmation, not since birth
  }

  // Who said so. `contributors` is the list of contributor ids that made a claim about this object
  // on this frame (the ledger's own attribution, summarised); the claims themselves stay in the
  // ledger.
  message Provenance {
    EvidenceSource   source       = 1;
    repeated string  contributors = 2;
    float            assoc_cost   = 3;  // the matched pair's total cost; 0 when nothing matched
    bool             reupdated    = 4;  // ORU reconstructed this track's gap this frame
  }

  // Re-acquisition facts. Today's wire carries `identity_confidence`/`dormant_millis` per
  // detection but the JSON republishes them only for the FOLLOW-locked track (R4 surprise 5, D6);
  // here they belong to the object, whoever is watching it.
  message Memory {
    bool  recovered           = 1;  // this frame re-acquired the identity from the gallery
    float identity_confidence = 2;  // the match score that justified it
    int64 dormant_ms          = 3;  // how long it had been dormant (for a DORMANT object: still is)
    int32 gallery_matches     = 4;  // dormant identities considered before this answer
    float match_distance      = 5;  // best appearance distance across the gallery, [0,1]
  }

  // Whether FOLLOW is holding this object. Frame-level `locked_track_id` says WHICH; this says so
  // on the object itself, which is the only form a renderer can use without a second lookup.
  message Lock {
    bool  locked           = 1;
    int64 lock_seq_applied = 2;  // the lock generation actually in force
  }

  // The counters death is decided from (E4). The three `*_ms` instants are on the SAME
  // timebase as this response's own `DetectionResponse.timestamp_millis` -- cv-service ages
  // tracks on a local monotonic clock and rebases once, at the wire, onto the frame's own
  // reported capture instant. So compare them against `timestamp_millis`, never against the
  // reader's wall clock: under DetectStream that anchor is the CALLER's clock, and under
  // DetectPulled it is the service host's. Durations elsewhere in this message
  // (`horizon_ms`, `since_confirmed_ms`, `dormant_ms`) are timebase-free and need no anchor.
  message Timing {
    int64 first_seen_ms     = 1;
    int64 last_seen_ms      = 2;
    int64 last_confirmed_ms = 3;
    int32 age_frames        = 4;
    int32 hits              = 5;
    int32 misses            = 6;
  }

  int64           id        = 1;  // per-stream track id; matches `Detection.track_id`
  ObjectLifecycle lifecycle = 2;
  string          stream_id = 3;  // keyed `(stream_id, id)` -- see the message comment

  Identity   identity   = 4;
  Kinematics kinematics = 5;
  Belief     belief     = 6;
  Provenance provenance = 7;
  Memory     memory     = 8;
  Lock       lock       = 9;
  Timing     timing     = 10;
}

// Frame -> detections streaming inference.
service Inference {
  rpc DetectStream(stream FrameRequest) returns (stream DetectionResponse);
  // NEW -- MEDIA-SOT-PLAN wave M1: worker dials mediamtx and decodes the pulled stream itself;
  // the client sends PullControl (desired state, see above) and receives the same DetectionResponse
  // push mode uses, with fields 16-21 populated. Additive: DetectStream is unchanged byte-for-byte.
  rpc DetectPulled(stream PullControl) returns (stream DetectionResponse);
  // NEW -- CV-ORCHESTRATION wave W0: read-only debug surface, off the response path entirely.
  rpc Inspect(InspectRequest) returns (InspectResponse);
}

// ---- CV-ORCHESTRATION wave W4 (docs/plans/active/CV-ORCHESTRATION-PLAN.md §4.9) ------------
// The DETECTOR role: the stateless half of a tracker/detector split. A detector instance holds
// no identity, no gallery, no lock and no session -- it turns pixels into boxes and says how
// busy it is. That is the whole reason it may be scaled to N instances behind an ordered target
// list while the tracker session stays sticky to one stream (§4.9, decision E11).
//
// Deliberately NOT a variant of `FrameRequest`: that message carries tracking config, camera
// pose, trace demand and a stream-scoped contract a detector has no business seeing. This one
// carries the pixels and the model, and `stream_id` only so an instance can ACCOUNT for the
// load it is serving -- never so it can hold state for that stream.

message DetectRequest {
  // Accounting only. A detector instance never keys state on this -- affinity lives in the
  // CALLER's ordered target list (§4.9 "affinity is a deployment requirement"), so two
  // consecutive frames of one stream may legitimately be served by two different instances.
  string stream_id           = 1;
  int64  sequence            = 2;
  int32  width               = 3;
  int32  height              = 4;
  ImageEncoding encoding     = 5;
  bytes  data                = 6;
  // The model REF, exactly as `FrameRequest.model_id` means it -- comma-separated routes a
  // composite. `model_version` is carried for symmetry with the response and is not resolved.
  string model_id            = 7;
  string model_version       = 8;
  float  confidence_threshold = 9;
  // Optional region of interest (the ROI rescue's crop, TRACKING-V2 wave C5c). Message
  // presence IS the option: absent = full frame. The detector crops and maps the boxes back
  // to full-frame coordinates itself, so the caller sends one frame, never two.
  BoundingBox roi            = 10;
}

message DetectResponse {
  repeated Detection detections = 1;  // track fields are always unset: a detector has no identity
  int64  inference_millis       = 2;
  string model_id               = 3;  // what actually served, which may differ from what was asked
  // Admission facts, on EVERY response (§4.9): the fleet budget is the sum of what instances
  // report, not a shared token. `occupancy` is how many passes are inside the gate right now,
  // `queue_depth` how many are waiting for a permit, `capacity` the gate's permit count.
  int32  occupancy              = 4;
  int32  queue_depth            = 5;
  int32  capacity               = 6;
  int32  max_queue              = 7;  // the bound above which this instance answers RESOURCE_EXHAUSTED
}

// Stateless detection. One RPC, unary on purpose: there is no per-stream state to keep a
// stream open for, and a unary call is what makes "try the next target" a one-line failover.
service Detector {
  rpc Detect(DetectRequest) returns (DetectResponse);
}

// Dataset training and model registry control plane.
service Training {
  rpc StartTraining(TrainingJobSpec) returns (stream TrainingProgress);
  rpc UploadDataset(stream DatasetChunk) returns (UploadAck);          // NEW
  rpc ListModels(google.protobuf.Empty) returns (ModelList);
  rpc PromoteModel(ModelRefMsg) returns (Ack);
}

// ---- VISUAL-GEO-V2, heavy-A (docs/plans/done/VISUAL-GEO-V2-PLAN.md §3.1) -------------------
// Pull-only: the worker dials the video source itself, exactly like Inference.DetectPulled.
// There is no frame payload on this wire, in either direction.

// Everything the rectifier and the priors need, restated on every GeoControl message.
// Every field is `optional` on purpose: an asset may have heading without a GPS fix, or a
// gimbal without an IMU.
message GeoTelemetry {
  optional double latitude              = 1;   // WGS-84 degrees, the aircraft's own reported fix
  optional double longitude             = 2;
  optional double amsl_meters           = 3;   // Telemetry.altitudeMeters -- above mean sea level
  optional double agl_meters            = 4;   // Telemetry.aglMeters -- what the projection wants
  optional double heading_degrees       = 5;   // vehicle yaw, clockwise from true north, [0,360)
  optional double groundspeed_mps       = 6;
  // Camera pointing, in rectify.py's convention: DEGREES FROM NADIR (0 = straight down,
  // 90 = horizon). The Java codec converts from Attitude's positive-up gimbal pitch exactly
  // once (VISUAL-GEO-V2-PLAN.md D6). Absent = nadir assumed.
  optional double camera_pitch_deg      = 7;
  optional double camera_roll_deg       = 8;
  optional double camera_yaw_deg        = 9;   // earth-frame gimbal yaw when present
  optional double horizontal_fov_deg    = 10;  // 0/absent = the region's assumed default
  int64  sample_millis                  = 11;  // epoch millis of THIS telemetry sample
  optional double gps_radius_meters     = 12;  // the raw fix's own 1-sigma, from HDOP when known
}

// Restricts retrieval to a disc around where the station already believes the aircraft is.
message GeoPrior {
  double latitude      = 1;
  double longitude     = 2;
  double radius_meters = 3;   // > 0
}

// Declarative desired state for one localization session. Restated on EVERY message, same
// doctrine as PullControl/TrackingConfig: a one-shot control message can be lost with no error.
message GeoControl {
  string stream_id                = 1;   // also the mediamtx path name
  string source_url               = 2;   // read from the FIRST message of the call only
  string rtsp_transport           = 3;   // first message only ("tcp"/"udp"/"")
  string region_id                = 4;   // "" = search every READY region
  float  target_fps               = 5;   // keyframe rate; <=0 = server default
  optional GeoTelemetry telemetry = 6;   // hot -- takes effect as soon as the worker sees it
  optional GeoPrior prior         = 7;   // hot
  bool   stop                     = 8;   // requests a clean drain + half-close
}

enum GeoStatus {
  GEO_STATUS_UNSPECIFIED = 0;
  GEO_STATUS_FIX           = 1;  // a position cleared every Python-side gate
  GEO_STATUS_NO_FIX        = 2;  // searched, nothing cleared; `refusal` says which gate
  GEO_STATUS_LOW_TEXTURE   = 3;  // rejected pre-encode (Laplacian/entropy floor) -- never encoded
  GEO_STATUS_OUT_OF_REGION = 4;  // the prior disc intersects no READY region
  GEO_STATUS_NO_INDEX      = 5;  // no READY region exists at all
  GEO_STATUS_ERROR         = 6;  // encoder/index/decode failure; `refusal` carries the reason
}

// Why the worker believes (or refuses) this fix. Java logs and serves this verbatim -- an
// operator must always be able to see WHY, not just WHAT (VISUAL-GEO-V2-PLAN.md D5).
message GeoEvidence {
  int32  candidate_count         = 1;   // top-k actually re-ranked
  int32  match_count             = 2;   // correspondences on the winning candidate
  int32  inlier_count            = 3;   // MAGSAC inliers -- the promotion gate
  double inlier_ratio            = 4;
  double rerank_margin           = 5;   // (s1 - s2) / max(s1, 1) over inlier scores
  double reprojection_rms_px     = 6;   // homography residual -- the ceiling applies at EVERY N
  bool   rectified               = 7;   // IPM actually applied (false = degraded to raw frame)
  bool   cell_calibrated         = 8;   // the winning cell has a real accept threshold, not never-accept
  int32  supporting_frames       = 9;   // distinct frames whose own inliers cleared the floor
  double baseline_meters         = 10;  // platform motion spanned by those frames
  bool   sequence_converged      = 11;
  double sequence_spread_meters  = 12;
  int32  sequence_updates        = 13;
  double osm_prior               = 14;  // the D8 tie-breaker's multiplier; 1.0 = inert
}

// Sentinels, spelled out once: every new enum's `0` value is its own `*_UNSPECIFIED`. A GeoFix
// without `latitude`/`longitude` is never a `(0,0)` position -- absence is absence. `refusal`
// is `""` only on GEO_STATUS_FIX.
message GeoFix {
  string stream_id             = 1;
  int64  sequence              = 2;   // monotonically increasing per session
  int64  frame_millis          = 3;   // capturedAt of the frame this fix came from (CaptureClock)
  GeoStatus status             = 4;
  string region_id             = 5;   // the region actually searched ("" when none was)
  string tile_id               = 6;   // "<z>/<x>/<y>" of the winning cell, for diagnostics
  optional double latitude     = 7;   // present iff status == GEO_STATUS_FIX
  optional double longitude    = 8;
  optional double yaw_degrees  = 9;   // camera image-up bearing; present only when the homography passed sanity
  optional double radius_meters       = 10;  // 1-sigma horizontal, always present with a position
  optional double implied_agl_meters  = 11;  // from the homography scale; the D-agl cross-check input
  GeoEvidence evidence         = 12;
  string refusal               = 13;  // "" on FIX; otherwise names the gate that refused
  int64  telemetry_age_millis  = 14;  // frame_millis - telemetry.sample_millis (signed, honest)
  int64  latency_millis        = 15;  // worker-side compute cost for this frame
}

// ---- Region ingest (harvested from feat/visual-geo, unchanged in shape) ----------------------
message ReferencePackChunk {
  string region_id = 1;   // set on EVERY chunk; must be identical throughout the stream
  bytes  content   = 2;   // concatenation in stream order is a ZIP: region.json + tiles/<z>_<x>_<y>.jpg
}

message ReferenceIndexStats {
  int32  tile_count                  = 1;
  int32  descriptor_count            = 2;
  int32  descriptor_dim              = 3;
  string encoder_id                  = 4;
  float  accept_similarity           = 5;   // self-calibrated on held-out tiles
  float  accept_margin               = 6;
  float  holdout_recall_at_1         = 7;
  float  holdout_median_error_meters = 8;
  int64  index_bytes                 = 9;
  int32  never_accept_cells          = 10;  // NEW: cells the calibration refuses outright
}

message ReferenceIndexProgress {
  string   region_id = 1;
  string   phase     = 2;   // "receiving"|"extracting"|"encoding"|"indexing"|"calibrating"|"done"
  int32    done      = 3;
  int32    total     = 4;   // 0 when the phase has no countable unit
  JobState state     = 5;   // reused: RUNNING | SUCCEEDED | FAILED
  string   message   = 6;
  optional ReferenceIndexStats stats = 7;   // present only on the terminal SUCCEEDED event
}

message RegionRef  { string region_id = 1; }
message RegionInfo {
  string region_id = 1;
  string name      = 2;
  int32  zoom      = 3;
  ReferenceIndexStats stats = 4;
  int64  built_at_millis    = 5;
  double north = 6; double south = 7; double east = 8; double west = 9;
}
message RegionList { repeated RegionInfo regions = 1; }

// LocalizeStream is pull-only (D2): GeoControl carries no frame payload, the worker dials the
// video source itself. Ack and google.protobuf.Empty are reused from the shipped contract.
service Geolocation {
  rpc LocalizeStream(stream GeoControl) returns (stream GeoFix);
  rpc BuildReferenceIndex(stream ReferencePackChunk) returns (stream ReferenceIndexProgress);
  rpc ListRegions(google.protobuf.Empty) returns (RegionList);
  rpc DeleteRegion(RegionRef) returns (Ack);
}
