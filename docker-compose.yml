# Full demo stack (docs/plans/done/MVP1-PLAN.md §C9 — see that section's exit criteria
# checklist, folded into README.md's "Demo" section too).
#
# Usage (see README.md "Demo" for the full walkthrough):
#   cp .env.example .env          # first time only
#   ./mvnw -B package -DskipTests # builds station/vision-app/target/vision-app-*.jar (see ./Dockerfile)
#   docker compose up -d
#   scripts/demo.sh ~/Videos/your-clip.mp4
#
# Services:
#   postgres    - persistence for every repository port (adapter-persistence,
#                 docs/plans/done/MVP2-PLAN.md P-a/P-b): vision-app below wires
#                 VISION_PERSISTENCE_JDBC_URL/USERNAME/PASSWORD against it,
#                 Flyway-migrated on first use. Unconditional since
#                 docs/plans/done/POSTGRES-ONLY-CONTEXT.md W2b -- there is no
#                 in-memory fallback left to opt out into.
#   mediamtx    - RTSP ingest / HLS egress sidecar (see ARCHITECTURE.md §6)
#   cv-service  - Python gRPC YOLO inference service (docs/plans/done/MVP1-PLAN.md §C7);
#                 combined Inference+Training+Geolocation, always on. An opt-in split
#                 (cv-service-inference / cv-service-training, "cv-split" profile) is also
#                 defined below for docs/plans/active/ARCHITECTURE-AUDIT-2026-08-26.md R6 --
#                 see the split services' own comments.
#   vision-app  - the Java application (this repo's root ./Dockerfile). An opt-in variant
#                 (vision-app-serial, "serial" profile, LINK-PAIRING-PLAN.md §3.2) adds a
#                 /dev/serial/by-id device passthrough for drone-link/carrier-serial -- see that
#                 service's own comment.
#
# Resilience demo (docs/plans/done/MVP1-PLAN.md §C9 exit criterion 4): the stack also
# works with cv-service missing entirely --
#   docker compose up -d --scale cv-service=0
# -- Compose skips depends_on/healthy waits for a service explicitly scaled to
# zero (verified against this Compose version), so vision-app still starts;
# `vision.cv.enabled=true` but every gRPC call fails fast, and StreamPipeline's
# outage policy (docs/plans/done/MVP1-PLAN.md §C7 bullet 3) degrades to "video/telemetry
# keep running, boxes just don't appear" -- exactly the same path a mid-demo
# `docker compose stop cv-service` exercises (see README.md).

# Shared cv-service build/healthcheck (docs/plans/active/ARCHITECTURE-AUDIT-2026-08-26.md R6):
# one image serves three deployment shapes -- the default combined `cv-service` below, plus the
# opt-in split `cv-service-inference`/`cv-service-training` (behind the "cv-split" profile,
# see those services' own comments) -- so the build/healthcheck config lives here once, not
# copy-pasted three times to drift apart.
x-cv-service-build: &cv-service-build
  build:
    context: .
    dockerfile: cv/cv-service/Dockerfile
  image: vision-cv-service:latest
x-cv-service-healthcheck: &cv-service-healthcheck
  healthcheck:
    # No grpcurl (or any grpc-health-checking tool) in the image -- a plain
    # TCP connect from the stdlib is enough to prove the gRPC server is
    # accepting connections, without adding a dependency just for this.
    # Protocol-agnostic (doesn't care which servicers this process registers),
    # so it's identical across all three deployment shapes above.
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50051), timeout=3).close()"]
    interval: 5s
    timeout: 3s
    retries: 6
    # Model load + Ultralytics' first-predict warmup (cv/cv-service/MODULE.md
    # "First-request latency") happen at process start, before the gRPC
    # server is serving -- generous enough for that even on a slow machine.
    start_period: 45s

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mediamtx:
    # Pinned, not :latest — mediamtx has shipped viewer-facing regressions in
    # routine releases, so every bump is deliberate and re-tested, never a
    # rubber-stamp version-string edit.
    #
    # 1.19.3 fixes #5975, directly relevant to this stack's HLS+WHEP viewing
    # path: with AllowOrigins left as a wildcard (this stack's default),
    # mediamtx used to echo the request's own Origin back in
    # Access-Control-Allow-Origin instead of "*" — the difference matters
    # because browsers only forward credentials (cookies) on the echoed-origin
    # form, so any third-party site could piggyback on a browser that had
    # ever entered credentials for this mediamtx and read its HLS/WebRTC
    # streams cross-origin. 1.19.3 now returns a literal "*", which is
    # credential-less by browser rules.
    #
    # Bumped 1.19.2 -> 1.19.3 with a full WHEP re-test (docs/plans/done/REALTIME-PLAN.md
    # exit criteria: healthy-stream soak + feed-kill/ICE-restart/recovery) —
    # see that test run's results for this bump. Re-run the same re-test on
    # every future bump, same as this one.
    #
    # (Historical, no longer the pin's rationale: an earlier revision of this
    # comment cited #4022 — WebRTC viewers freezing on stream interruption,
    # introduced in v1.10.0 — as the reason to pin. That bug was fixed in
    # v1.11.1, long before this pin was ever taken, so it was already dead
    # history even at 1.19.2. Kept only so nobody goes hunting for a live
    # #4022 regression that isn't there.)
    image: bluenviron/mediamtx:1.19.3
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP
      # Host 18888, not 8888: mediamtx's default HLS port collides with common
      # dev services (seen in the wild: open-webui/uvicorn on 8888). Only
      # matters for a host-run vision-app (Quickstart) -- inside this compose
      # network, vision-app talks to mediamtx on its *own* 8888 (container
      # ports aren't remapped between containers), see vision-app's
      # VISION_PUBLISH_MEDIAMTX_HLS_BASE below. Must match
      # vision.publish.mediamtx.hls-base's host-mode default in vision-app's
      # application.yaml.
      - "18888:8888" # HLS
      # WHEP (docs/plans/done/MVP2-PLAN.md L-a): same collision-avoidance rationale and
      # host/container split as HLS above -- host 18889, container's own
      # default 8889 unaffected. Unlike HLS, WHEP has no vision-app-side
      # proxy, so *browsers* hit this mapped port directly; must match
      # vision.publish.mediamtx.whep-base's host-mode default in vision-app's
      # application.yaml.
      - "18889:8889" # WHEP (WebRTC signaling: POST offer / HTTP)
      # WebRTC media (ICE/UDP). This one CANNOT be renumbered like the two
      # above: mediamtx bakes its own listening port (mediamtx.yml's default
      # webrtcLocalUDPAddress ":8189") into the ICE candidates it sends the
      # browser, and Docker's host<->container port mapping doesn't rewrite
      # SDP/ICE payloads -- so the host port here must equal the container
      # port or the browser will try to reach a UDP port nothing is actually
      # listening on.
      - "8189:8189/udp" # WebRTC media (ICE/RTP)
      # Playback server (docs/plans/done/OPS-CORE-PLAN.md §R): host 19996, same 1:1
      # host:container style as the other mediamtx ports above -- container's
      # own default is 9996 (mediamtx's own PlaybackAddress default,
      # ":9996"), set explicitly below via MTX_PLAYBACKADDRESS for the same
      # "pin, don't silently inherit" reason as the MTX_HLS* block further
      # down. Serves GET /get?path=&start=&duration= (clip export -- see
      # MediamtxStreamPublisher#playbackUrl, adapter-publish-hls/MODULE.md)
      # and GET /list?path= (recorded ranges) over the recordings written by
      # MTX_PATHDEFAULTS_RECORD below.
      #
      # Deliberately left published on ALL interfaces, unlike the Control API's loopback-only
      # binding just below -- checked and decided consistently, not left this way by oversight.
      # Two facts distinguish it: (1) this is read-only egress, not a mutation surface -- GET only,
      # no path create/patch/delete, same shape as the RTSP/HLS/WHEP media ports above that mediamtx
      # already serves openly by design. (2) UsageRecordingResponse#url (vision-api,
      # UsageTimelineController#recording) hands this server's URL straight to the BROWSER, verbatim
      # -- vision-app never proxies it the way HlsProxyController proxies HLS -- so it has the same
      # "must be reachable by the *viewer's* browser, not just this app's own JVM" shape as WHEP's
      # 18889 above, not the Control API's "only vision-app itself ever calls this" shape. Binding
      # this to loopback would silently break clip export/replay for every viewer not on the Docker
      # host itself.
      #
      # UPDATE (docs/plans/active/ASSET-FLOWS-PLAN.md §2 S6): this port is NO LONGER unauthenticated.
      # ./mediamtx.yml now gates the "playback" action behind the `vision-viewer` account (same
      # account HLS/WHEP read auth uses) -- the paragraph this replaces was accurate when written but
      # is now stale; see that file's authInternalUsers block for the current model. Anyone who can
      # reach this host still needs vision-viewer's credentials to list/download recorded clips.
      # UsageTimelineController#recording (vision-api) appends them as `?user=&pass=` query
      # parameters to the URL it hands the browser verbatim, mirroring MediamtxStreamPublisher/
      # MediamtxProxyPublisher's own playbackUrl -- see VISION_MEDIA_AUTH_* below for where those
      # credentials come from.
      - "19996:9996" # Playback API (recording clip export)
      # Control API (docs/plans/done/MEDIA-SOT-PLAN.md §5.3): container default is 9997 (mediamtx's
      # own apiAddress default, ":9997"), set explicitly below via MTX_API/MTX_APIADDRESS for the
      # same "pin, don't silently inherit" reason as the MTX_HLS*/MTX_PLAYBACKADDRESS blocks. Serves
      # the create/patch/get/delete-path calls MediamtxProxyPublisher makes when
      # vision.publish.source-proxy.enabled=true (vision-app's application.yaml) -- unreached, and
      # therefore inert, whenever that flag is off (D1). Auth: see the ./mediamtx.yml mount below --
      # mediamtx's own baked-in Control API auth is IP-gated to 127.0.0.1/::1, which no
      # docker-published port or sibling container satisfies, so that file widens the "any" user's
      # ips to [] (unrestricted) for the compose network.
      #
      # HOST BINDING IS LOOPBACK-ONLY (127.0.0.1:19997:9997), NOT 19997:9997 -- this is the actual
      # fix for a real incident, not defensive styling. An earlier revision of this file published
      # 19997:9997 on ALL host interfaces. Combined with mediamtx.yml's api ips: [] widening (needed
      # so the sibling vision-app container stops 401ing), that meant: anyone who could reach the
      # Docker host on port 19997 -- from the LAN, or the internet if the host is exposed, which
      # matters concretely because this stack is deployed on field servers as a drone command point
      # (CLAUDE.md's deployment section) -- could create, repoint, or delete mediamtx paths with zero
      # credentials. Unlike the media ports above (openly exposed by design), this is a path-mutation
      # surface; that combination was a real hole, not a theoretical one.
      #
      # Loses nothing real: MediamtxProxyPublisher (adapter-publish-hls, used only when
      # source-proxy.enabled=true) is called exclusively from inside the vision-app container, which
      # reaches this Control API over the compose network at http://mediamtx:9997 -- the
      # container-internal port, same "container port, not host port" rule VISION_PUBLISH_MEDIAMTX_*
      # below already establishes for rtsp-base/hls-base. It does NOT go through this host mapping at
      # all, so binding the mapping to loopback changes nothing for the compose-network path (today
      # inert anyway, since source-proxy.enabled defaults false, D1). A host-run vision-app
      # (Quickstart, application.yaml's own http://localhost:19997 default) still reaches it fine --
      # loopback IS localhost. What loopback binding does change: a caller on the LAN or internet can
      # no longer reach this port at all, which is exactly the point.
      #
      # A mediamtx NOT co-located with vision-app on the same Docker host (a different deployment
      # shape than this file, which always runs both as sibling containers) cannot use loopback
      # binding to reach this API either -- that deployment must instead configure real Basic-auth
      # credentials (vision.publish.mediamtx.api-user/api-password, application.yaml) against a real
      # user in that remote mediamtx's own authInternalUsers config, not an ips: [] widening, which
      # only makes sense on a network as trusted as this one compose stack's private bridge. See
      # .env.example for the property/env-var names.
      - "127.0.0.1:19997:9997" # Control API (MediamtxProxyPublisher: dynamic path add/patch/get/delete) -- loopback-only, see comment above
    environment:
      # mediamtx's default ICE candidate gathering (webrtcIPsFromInterfaces:
      # true) advertises this *container's* own network-namespace IPs (e.g.
      # 172.x.x.x on the compose bridge network) -- unreachable from a
      # browser on the host. MTX_WEBRTCADDITIONALHOSTS makes mediamtx also
      # advertise an address the browser can actually reach (paired with the
      # 1:1 UDP mapping above), which WHEP viewing needs to work at all
      # through this compose stack.
      #
      # docs/plans/done/MVP2-PLAN.md V-e: parametrized via VISION_WEBRTC_HOST (see
      # .env.example) instead of a hardcoded 127.0.0.1 -- defaults to
      # 127.0.0.1 (same-host-only, unchanged behavior) when unset. LAN
      # operators should set VISION_WEBRTC_HOST to this machine's own LAN IP
      # (e.g. "192.168.0.104") so phones/laptops on the LAN get sub-second
      # WebRTC instead of always falling back to HLS -- find it with
      # `hostname -I` (Linux), `ipconfig getifaddr en0` (macOS), or
      # `ipconfig` (Windows, "IPv4 Address"). Off-LAN viewers (and anyone
      # this isn't configured for) still transparently fall back to HLS,
      # which has no such reachability limitation.
      #
      # Env-list encoding, VERIFIED (not assumed): mediamtx's own env-var
      # loader splits list-typed fields on commas -- confirmed directly by
      # the mediamtx maintainer for this exact variable (github.com/
      # bluenviron/mediamtx discussions #3360: "in order to do it with
      # environment variables it's enough to use commas:
      # MTX_WEBRTCADDITIONALHOSTS=192.168.x.x,example.org"), consistent with
      # internal/conf/env/env.go's generic string-slice handling
      # (`strings.Split(ev, ",")`). So VISION_WEBRTC_HOST can itself be a
      # comma-separated list (e.g. "127.0.0.1,192.168.0.104") -- a bare
      # single value *replaces* the default 127.0.0.1 outright, it does not
      # add to it, so an operator who wants both same-host and LAN viewers
      # working simultaneously must list both explicitly.
      #
      # LOCALHOST-ONLY BY DEFAULT, LAN-reachable once configured: a browser
      # on a *different* machine (e.g. a friend's laptop on the same LAN,
      # per the MVP1 "friends demo" scenario) cannot use WebRTC/WHEP against
      # this stack until VISION_WEBRTC_HOST names an address that machine
      # can reach. HLS (the existing viewUrl) has no such limitation and
      # remains the cross-host-reliable fallback; see adapter-publish-hls/
      # MODULE.md and station/vision-app/MODULE.md ("WHEP viewing" section) for the
      # full WHEP-in-Docker writeup.
      MTX_WEBRTCADDITIONALHOSTS: "${VISION_WEBRTC_HOST:-127.0.0.1}"
      # docs/plans/done/MVP2-PLAN.md V-a (glass-to-glass latency): mediamtx's own default
      # already *is* Low-Latency HLS (verified against the actual pulled
      # bluenviron/mediamtx:latest image, v1.19.2, by extracting its baked-in
      # mediamtx.yml -- hlsVariant: lowLatency, hlsSegmentDuration: 1s,
      # hlsPartDuration: 200ms, hlsSegmentCount: 7, all already exactly these
      # values). These four are set explicitly anyway, not because compose
      # needs to change mediamtx's behavior today, but so a future upstream
      # image update can never silently regress this stack back to
      # multi-second HLS by changing its defaults out from under us -- the
      # latency budget is now pinned at the compose level, not inherited.
      #   - MTX_HLSVARIANT=lowLatency: CMAF fMP4 muxing with #EXT-X-PART
      #     entries (blocking playlist reload via _HLS_msn/_HLS_part), the
      #     prerequisite for any low-latency HLS playback at all.
      #   - MTX_HLSSEGMENTDURATION=1s: matches adapter-publish-hls's encoder
      #     GOP (MediamtxStreamPublisher.GOP_SECONDS=1, see its MODULE.md) --
      #     a segment can never be shorter than the keyframe interval it's
      #     cut on, so the two must be kept in lock-step by hand; if the GOP
      #     is ever changed, this must change with it.
      #   - MTX_HLSPARTDURATION=200ms: the sub-second delivery granularity
      #     LL-HLS clients (not the stock hls.js this app ships pre-V-b) can
      #     fast-follow on, well inside one 1s GOP/segment.
      #   - MTX_HLSSEGMENTCOUNT=7: the *minimum* mediamtx's own lowLatency
      #     variant accepts -- it refuses to start below 7 (verified against
      #     gohlslib's muxer validation, the library mediamtx's HLS server is
      #     built on). Pinned at exactly the floor rather than left higher:
      #     more segments only means a longer scrub-back window and more
      #     RAM/CDN cache held for a live-only demo stream, not a latency
      #     change either way.
      MTX_HLSVARIANT: "lowLatency"
      MTX_HLSSEGMENTDURATION: "1s"
      MTX_HLSPARTDURATION: "200ms"
      MTX_HLSSEGMENTCOUNT: "7"
      # docs/plans/done/OPS-CORE-PLAN.md §R (recording + clip export): mediamtx's own
      # native recorder, not a custom sidecar. Env var names verified against
      # mediamtx v1.19.3's own source (internal/conf/env/env.go builds each
      # var as "MTX_" + the struct field's json tag, uppercased, with no
      # other transformation -- same rule already documented above for
      # MTX_HLS*; internal/conf/path.go's per-path `Record`/`RecordDeleteAfter`
      # fields live under the top-level `pathDefaults` struct (conf.go), so
      # their env vars are MTX_PATHDEFAULTS_RECORD* not MTX_RECORD*).
      #   - MTX_PATHDEFAULTS_RECORD=yes: turns on recording for every path by
      #     default (per-path override still possible via the API, unused
      #     here). Segments are muxed as fMP4 (mediamtx's own default
      #     recordFormat, left unset -- not "mpegts"), which is what the
      #     playback server's /get endpoint below serves back out.
      #   - MTX_PATHDEFAULTS_RECORDDELETEAFTER=1h: retention.
      #     **Deliberately far below** mediamtx's own 24h default and below the
      #     72h docs/plans/done/OPS-CORE-PLAN.md §R specifies for a real deployment --
      #     because MTX_PATHDEFAULTS_RECORD above records *every* path, and in
      #     this dev stack most paths are simulated drones (adapter-simulation)
      #     that stream continuously for as long as the app is up. Measured on
      #     this stack: ~1.8 GB per hour per stream (hourly fMP4 segments of
      #     1.76-1.84 GB), so a single always-on synthetic source trends toward
      #     ~130 GB before 72h retention prunes anything -- which is exactly how
      #     this volume reached 8.4 GB across 15 stale device paths and helped
      #     fill a 159 GB disk. 1h keeps clip export and the playback server
      #     below demonstrable without letting a test source eat the disk.
      #     Raise this back to 72h (or §R's own value) for any deployment that
      #     records real flights -- and prefer turning MTX_PATHDEFAULTS_RECORD
      #     off with per-path enable via mediamtx's API if simulated sources
      #     ever share a host with real ones.
      #   - Segments land at mediamtx's own default recordPath
      #     ("./recordings/%path/%Y-%m-%d_%H-%M-%S-%f", unset/un-overridden
      #     here) -- NOT changed to an absolute path, because the mediamtx
      #     image (docker/standard.Dockerfile upstream, FROM scratch, no
      #     WORKDIR) runs with cwd "/", so that relative path already
      #     resolves to /recordings/... inside the container. The
      #     mediamtx-recordings volume below is mounted at exactly that
      #     path, so recordings land on a named Docker volume, never bind-
      #     mounted into this repo's worktree.
      #   - MTX_PLAYBACK=yes / MTX_PLAYBACKADDRESS=:9996: mediamtx's own
      #     playback HTTP server (":9996" is also mediamtx's own default,
      #     pinned explicitly for the same future-drift reason as the
      #     MTX_HLS* block above), exposing GET /get?path=&start=&duration=
      #     (single-MP4 clip export -- this IS clip export, no custom
      #     trimming code needed, see MediamtxStreamPublisher#playbackUrl)
      #     and GET /list?path= (recorded ranges). Mapped to host 19996
      #     above.
      MTX_PATHDEFAULTS_RECORD: "yes"
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: "1h"
      MTX_PLAYBACK: "yes"
      MTX_PLAYBACKADDRESS: ":9996"
      # Control API (docs/plans/done/MEDIA-SOT-PLAN.md §5.3, wave M7): MTX_API=yes alone is NOT
      # sufficient for MediamtxProxyPublisher's calls to succeed -- mediamtx's own baked-in
      # authInternalUsers grants unauthenticated `api` action access only to a caller at
      # 127.0.0.1/::1, which a sibling container (vision-app, calling over this compose network)
      # never is. MTX_AUTHINTERNALUSERS as an env override was tried during wave M0's spike and
      # does not work (no list-of-struct override for that field) -- the ./mediamtx.yml mount
      # below is the actual fix, widening that same "any" user's `ips` to unrestricted. Both are
      # kept: MTX_API/MTX_APIADDRESS here for the same "pin explicitly" reason as MTX_PLAYBACK*
      # above (mediamtx.yml's own api/apiAddress lines would otherwise be the only place this is
      # set, and a future edit to that file could silently turn the API back off), MTX_APIADDRESS
      # matching mediamtx's own default (":9997") like MTX_PLAYBACKADDRESS does for :9996. This
      # widened ips allowlist is safe only paired with the loopback-only host publish of this same
      # port above ("127.0.0.1:19997:9997") -- see that port's own comment for the incident where an
      # earlier, all-interfaces publish turned this widening into an unauthenticated LAN/internet
      # mutation surface.
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
    volumes:
      # Widens mediamtx's own baked-in Control API auth (see the MTX_API comment above) --
      # read-only, mounted at /mediamtx.yml because the mediamtx image's own default config-file
      # lookup is "mediamtx.yml in the current directory", and that image's cwd is "/" (FROM
      # scratch, no WORKDIR -- same fact this file's own MTX_PATHDEFAULTS_RECORD comment already
      # established for the recordings path). See mediamtx.yml's own header comment for the full
      # writeup, and the Control API port comment above for why widening ips: [] here is safe: it
      # depends on that port's host publish staying loopback-only, it is not "safe unconditionally"
      # regardless of how the port is published (every env var above still applies as an override on
      # top of it, exactly as before this file existed -- that part is unaffected).
      - ./mediamtx.yml:/mediamtx.yml:ro
      # Named volume, NOT a repo bind mount (docs/plans/done/OPS-CORE-PLAN.md §R) --
      # recordings are potentially large fMP4 segments with a 72h retention
      # window; keeping them on a Docker-managed volume keeps the worktree
      # clean and lets `docker volume rm mediamtx-recordings` wipe them
      # independently of the repo. See the MTX_PATHDEFAULTS_RECORD* comment
      # above for why /recordings (not some other path) is the mount point.
      - mediamtx-recordings:/recordings

  cv-service:
    # Context is the repo root: the Dockerfile copies /proto (shared contract) in addition to /cv-service.
    # Runs the Dockerfile's default CMD (`python -m cv_service.grpc.server`, CV_SERVICE_ROLE
    # unset -> Settings.role defaults to "all") -- Inference + Training + Geolocation in ONE
    # process, byte-identical to this stack's behavior before R6. No profile: always part of
    # plain `docker compose up`, unlike the split services below.
    <<: [*cv-service-build, *cv-service-healthcheck]
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      # Both UNSET by default, which is exactly the pre-W4 behaviour: role `all`,
      # detection in-process. Set them together to turn this container into the
      # tracker half of a detector pool -- see the cv-detector block below.
      CV_SERVICE_ROLE: ${CV_SERVICE_ROLE:-}
      CV_DETECTOR_TARGETS: ${CV_DETECTOR_TARGETS:-}

  # --- Detector pool (docs/plans/active/CV-ORCHESTRATION-PLAN.md §4.9, wave W4, opt-in) -----
  #
  # The OTHER split, on a different axis from `cv-split` below: that one separates a
  # latency-sensitive servicer from long-running ones, this one separates STATEFUL work
  # (identity, gallery, lock -- sticky to one stream) from STATELESS work (pixels to boxes).
  # A detector holds nothing, so it scales horizontally; a tracker session holds a stream's
  # identities, so it must not move.
  #
  #   docker compose --profile scale up -d cv-detector-1 cv-detector-2
  #   CV_SERVICE_ROLE=tracker \
  #   CV_DETECTOR_TARGETS=cv-detector-1:50051,cv-detector-2:50051 \
  #     docker compose up -d --force-recreate cv-service
  #
  # AFFINITY IS A DEPLOYMENT REQUIREMENT, NOT CODE (§4.9, decision E11). Three rules, and
  # every one of them is something this file has to get right because no code can:
  #
  #  1. ONE tracker process per app instance, and the app's `VISION_CV_ENDPOINT` points at
  #     exactly that one. Two trackers behind one address silently reset a stream's ids on
  #     the first reconnect that lands on the other (R3 §6) -- the failure this ordering
  #     exists to prevent. The `cv-detector-N` services below are the ONLY part of this
  #     picture that may be scaled.
  #  2. `CV_DETECTOR_TARGETS` is an ORDERED list tried first-to-last, `pick_first` semantics,
  #     never load balancing. A healthy first target therefore serves every frame of every
  #     stream -- which is what makes a detector swap mid-stream invisible to identities,
  #     because there is no swap unless the first target refuses or dies.
  #  3. NAME the detectors individually. Do NOT point the list at one service name scaled to
  #     N replicas: Docker's DNS would round-robin it, which turns a deliberate order into
  #     an accident, and a single-resolution gRPC channel would pin to whichever replica it
  #     happened to resolve first anyway. Add a third instance by copying a block, not by
  #     `--scale`.
  #
  # Append `,local` to the list to keep the tracker's own in-process detector as the last
  # resort (`CV_DETECTOR_TARGETS=cv-detector-1:50051,local`); leave it off for a tracker that
  # should degrade visibly rather than quietly absorb the fleet's load.
  #
  # Each detector admits what its own gate can take and answers RESOURCE_EXHAUSTED above
  # `CV_DETECTOR_MAX_QUEUE` (default 2) instead of queueing -- the caller then tries the next
  # target. The fleet budget is the sum of what the instances report (decision E10); there is
  # no shared token anywhere.
  cv-detector-1:
    profiles: ["scale"]
    <<: [*cv-service-build, *cv-service-healthcheck]
    restart: unless-stopped
    environment:
      CV_SERVICE_ROLE: detector
      # Raise on a box with cores to spare; this is the per-instance concurrency bound.
      CV_MAX_CONCURRENT_INFERENCES: ${CV_DETECTOR_CONCURRENCY:-2}
      CV_DETECTOR_MAX_QUEUE: ${CV_DETECTOR_MAX_QUEUE:-2}
    # No published host port on purpose: a detector is reached over the compose network by
    # the tracker only. Publish one (e.g. "50071:50051") if you want to `grpcurl` it by hand.

  cv-detector-2:
    profiles: ["scale"]
    <<: [*cv-service-build, *cv-service-healthcheck]
    restart: unless-stopped
    environment:
      CV_SERVICE_ROLE: detector
      CV_MAX_CONCURRENT_INFERENCES: ${CV_DETECTOR_CONCURRENCY:-2}
      CV_DETECTOR_MAX_QUEUE: ${CV_DETECTOR_MAX_QUEUE:-2}

  # --- Split cv-service (docs/plans/active/ARCHITECTURE-AUDIT-2026-08-26.md R6, opt-in) -----
  #
  # Same image as cv-service above, differing only by CV_SERVICE_ROLE (cv_service/config.py) --
  # so a long-running, GPU-hungry Training/Geolocation job can never share a process (or a GIL)
  # with Inference's ~50ms-budget per-frame hot path. Gated behind the "cv-split" Compose
  # profile: `cv-service` (no profile) always starts on a plain `docker compose up`, profile
  # gating never turns it off -- so bringing up "cv-split" ALONGSIDE it would double-serve on
  # container port 50051 (harmless at the Docker level, since each is a separate container and
  # host ports differ below, but wasteful and not the point). Run split mode with:
  #
  #   docker compose up -d --scale cv-service=0 --profile cv-split cv-service-inference cv-service-training
  #
  # -- the same `--scale cv-service=0` idiom the resilience demo at the top of this file already
  # uses, so `cv-service`'s own healthy-wait is skipped for vision-app too.
  #
  # NOT WIRED into vision-app below: VISION_CV_ENDPOINT is still single-target (cv/grpc's
  # GrpcCvSettings/VisionCvProperties do not yet expose `inference.targets`/`training.target` --
  # see cv/grpc/MODULE.md "Multi-target / R6 split" for the channel-building support that already
  # exists and the config keys a future wave wires up). Until then, point VISION_CV_ENDPOINT at
  # cv-service-inference:50051 to get live detection under a split deployment; Training/
  # Geolocation RPCs need a separate client pointed at cv-service-training:50051 (today: only
  # vision-app's own CvWiring, which isn't multi-target yet either).
  cv-service-inference:
    profiles: ["cv-split"]
    <<: [*cv-service-build, *cv-service-healthcheck]
    command: ["python", "-m", "cv_service.grpc.server_inference"]
    restart: unless-stopped
    ports:
      - "50061:50051"

  cv-service-training:
    profiles: ["cv-split"]
    <<: [*cv-service-build, *cv-service-healthcheck]
    command: ["python", "-m", "cv_service.grpc.server_training"]
    restart: unless-stopped
    ports:
      - "50062:50051"

  vision-app: &vision-app-base
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
      cv-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      VISION_CV_ENABLED: "true"
      VISION_CV_ENDPOINT: cv-service:50051
      # Compose-internal addressing: mediamtx's *own* container ports (RTSP
      # 8554, HLS 8888) -- not the 18888 host mapping above, which exists only
      # for a host-run vision-app talking to mediamtx over localhost.
      VISION_PUBLISH_MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
      VISION_PUBLISH_MEDIAMTX_HLS_BASE: http://mediamtx:8888
      # docs/plans/done/MEDIA-SOT-PLAN.md §5.3, wave M7 (gap closed in M9): MediamtxProxyPublisher's
      # Control API base, read by vision-app ITSELF (server-side, like rtsp-base/hls-base above), so
      # the compose-internal "mediamtx" hostname is correct here too -- unlike whep-base below, no
      # browser ever touches this URL. Only matters once vision.publish.source-proxy.enabled=true is
      # turned on (off by default, D1); left unset, application.yaml's own default
      # (http://localhost:19997) would resolve inside THIS container to itself, not to the mediamtx
      # service -- a real defect this compose file shipped with M7 (the sibling RTSP/HLS vars got the
      # compose-internal treatment, this one didn't) and would only surface once source-proxy is
      # flipped on. Container port 9997, not the 19997 host mapping above -- that mapping is also
      # loopback-only (127.0.0.1:19997:9997, see the mediamtx service's own Control API port comment),
      # so it wouldn't be reachable from this container even by address, only by container port.
      VISION_PUBLISH_MEDIAMTX_API_BASE: http://mediamtx:9997
      # docs/plans/done/MEDIA-SOT-PLAN.md §5.5, wave M7: the address the WORKER (cv-service) dials
      # for a pulled stream -- only read when vision.cv.frame-transport=pull (off by default, D1;
      # this var is inert against the default push transport). Defaults to the same
      # compose-internal "mediamtx" hostname as VISION_PUBLISH_MEDIAMTX_RTSP_BASE above, which is
      # equally resolvable from the cv-service container on this same compose network. Override via
      # .env (see .env.example) to the host's LAN address for a REMOTE worker (e.g. the GB4005 box)
      # that cannot resolve this compose network's own "mediamtx" hostname at all -- the same reason
      # this property is deliberately separate from vision.publish.mediamtx.rtsp-base in the first
      # place (see VisionCvProperties.Pull's own javadoc).
      VISION_CV_PULL_RTSP_BASE: ${VISION_CV_PULL_RTSP_BASE:-rtsp://mediamtx:8554}
      # Deliberately NOT mirroring the compose-internal-hostname pattern above
      # (docs/plans/done/MVP2-PLAN.md L-a): rtsp-base/hls-base are consumed by vision-app
      # itself (server-side), so the compose-internal "mediamtx" hostname is
      # correct and resolvable from inside this container. whep-base is
      # different -- vision-app never connects to it, it only hands the URL
      # to the *browser* (see VisionPublishProperties's "WHEP has no third
      # base" javadoc), and "mediamtx" is not resolvable from the host where
      # the browser runs. So this stays the same host-mapped-port value as
      # application.yaml's own default (http://localhost:18889) even
      # though vision-app is containerized here -- set explicitly (rather
      # than left to the default) so this reasoning is visible at the compose
      # level, not just in source.
      VISION_PUBLISH_MEDIAMTX_WHEP_BASE: http://localhost:18889
      # docs/plans/active/ASSET-FLOWS-PLAN.md §2 "S6 auth model": the viewer/publisher credential pair
      # every mediamtx collaborator in this app sends -- MediamtxStreamPublisher's RTSP push
      # (publisher creds, embedded in the push URL's userinfo), MediamtxStreamPublisher/
      # MediamtxProxyPublisher's WHEP/playback URLs (viewer creds, appended as `?user=&pass=` for the
      # browser), HlsProxyController's outbound HLS fetch (viewer creds, as an Authorization: Basic
      # header), and MediamtxLiveFrameGrabber/MediamtxReplayFrameExtractor's server-side reads (viewer
      # creds). Spring's relaxed binding maps these four env vars onto
      # vision.media.auth.viewer-username/-password/publisher-username/-password (VisionMediaProperties,
      # station/vision-app) -- see application.yaml's `vision.media` block for the same defaults
      # spelled out in property form (`vision-viewer`/`change-me`, `vision-publisher`/`change-me`).
      #
      # MUST be kept in sync BY HAND with ./mediamtx.yml's authInternalUsers `pass:` fields for the
      # `vision-viewer`/`vision-publisher` accounts -- mediamtx's env-var loader has no override for
      # that list-of-struct config field (see mediamtx.yml's own header comment for the full
      # explanation), so this env block and that YAML file are two independent copies of the same
      # secret. Changing the password here without changing it there (or vice versa) breaks auth:
      # mediamtx rejects credentials this app is no longer sending, or accepts a stale password this
      # app no longer knows. Anyone deploying beyond local dev/demo MUST override BOTH the `change-me`
      # defaults below AND the matching `pass:` lines in mediamtx.yml, together, in the same change --
      # same "DEV-ONLY, must be changed before exposing this" posture as VISION_PERSISTENCE_SEED_DEV_USERS
      # below.
      VISION_MEDIA_AUTH_VIEWER_USERNAME: ${VISION_MEDIA_AUTH_VIEWER_USERNAME:-vision-viewer}
      VISION_MEDIA_AUTH_VIEWER_PASSWORD: ${VISION_MEDIA_AUTH_VIEWER_PASSWORD:-change-me}
      VISION_MEDIA_AUTH_PUBLISHER_USERNAME: ${VISION_MEDIA_AUTH_PUBLISHER_USERNAME:-vision-publisher}
      VISION_MEDIA_AUTH_PUBLISHER_PASSWORD: ${VISION_MEDIA_AUTH_PUBLISHER_PASSWORD:-change-me}
      # docs/plans/done/MVP2-PLAN.md P-a: wire fleet persistence (categories/devices/
      # assets) against the postgres service above -- compose-internal
      # hostname/port, not the host-mapped ${POSTGRES_PORT} below (same
      # container-vs-host addressing split as mediamtx's ports). Credentials
      # come straight from .env (see .env.example) via compose interpolation.
      # Unconditional wiring since docs/plans/done/POSTGRES-ONLY-CONTEXT.md W2b -- there
      # is no longer a flag to set here.
      VISION_PERSISTENCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      VISION_PERSISTENCE_USERNAME: ${POSTGRES_USER}
      VISION_PERSISTENCE_PASSWORD: ${POSTGRES_PASSWORD}
      # docs/plans/done/POSTGRES-ONLY-CONTEXT.md W1: replaces the deleted code-based
      # AuthSeedRunner, which used to seed these same three accounts unconditionally
      # at boot (and, before W1, minted a *random* root group id every restart --
      # the empty-fleet bug this plan fixes). Seeding now lives in a Flyway
      # migration (storage/persistence/.../db/seed/dev) that only applies when this
      # flag is true, so the demo stack keeps working exactly as it did before:
      # admin/admin (ADMIN), manager/manager (MANAGER), pilot/pilot (PILOT) --
      # DEV-ONLY passwords equal to their usernames, see that migration's own
      # header warning. Anyone standing this compose file up beyond local
      # dev/demo MUST create real users through UserService and change/remove
      # these seeded accounts before exposing it.
      VISION_PERSISTENCE_SEED_DEV_USERS: "true"
      # docs/plans/done/U-AUTH-PLAN.md wave 3: turn on real Spring Security session auth
      # for anyone using `docker compose up`. Redundant since
      # docs/plans/active/AUTH-ROLES-PLAN.md B0b flipped vision.auth.enabled's own
      # *compiled* default (vision-app's application.yaml) to true -- this compose
      # stack would get session auth either way now. Left set explicitly anyway: it
      # documents intent for this file's readers and survives if the compiled
      # default is ever revisited. The compiled default staying at false was never
      # this file's concern to begin with -- it's what ~26 unrelated
      # @SpringBootTest classes plus AuthDisabledSecurityTest still pin in
      # src/test/resources/application.properties, so tests are unaffected by
      # either value here (see station/vision-app/MODULE.md's "Auth / session
      # security" section).
      VISION_AUTH_ENABLED: "true"
      # docs/plans/active/AUTH-ROLES-PLAN.md §3.6, wave B5: sessions now live in SPRING_SESSION rows
      # in the `postgres` service above (V34__spring_session.sql), inside the SAME postgres-data
      # named volume already mounted below -- no separate session store/volume needed, and a
      # `docker compose restart`/redeploy of vision-app no longer logs every operator out. secure
      # stays false (VisionAuthProperties' own default) for this stack: it terminates plain HTTP on
      # 8080, no reverse proxy in front, and a Secure cookie sent over plain HTTP is silently
      # dropped by the browser -- which would look like login "not sticking". Flip to "true" once
      # this stack sits behind a TLS-terminating reverse proxy.
      VISION_AUTH_SESSION_COOKIE_SECURE: ${VISION_AUTH_SESSION_COOKIE_SECURE:-false}

      # --- Shipped-but-dark features, switched on for this deployment ---
      # E2E-FLOW-AUDIT-2026-09-05.md proposal U1. Each of these is built, tested and
      # merged, but its compiled default is `false` so a fresh `mvn` build behaves as
      # it did before the feature existed. That default is deliberate and stays --
      # ~26 @SpringBootTest classes and every developer's `mvn spring-boot:run`
      # depend on it. This file is where the *run* is described (CLAUDE.md
      # "Deployment maintenance"), so this is the right place to turn them on, and
      # the only one: leaving them off here meant the audit found eight features
      # nobody could reach on a real server.
      #
      # Env-var spelling: Spring's relaxed binding accepts `_` for `-`
      # (SystemEnvironmentPropertyMapper's legacy-name candidate), which is the
      # convention VISION_PERSISTENCE_SEED_DEV_USERS above already relies on.

      # vision.crew.enabled -- two seats (pilot/camera) per aircraft. Its own config
      # comment requires a second real person to be possible, i.e. auth on: satisfied
      # by VISION_AUTH_ENABLED above. Off, SeatAccess is a pass-through.
      VISION_CREW_ENABLED: "true"
      # vision.onboarding.probe.enabled -- read-only firmware capability/parameter
      # probes over the link the aircraft already streams telemetry on. Reads only;
      # enabling this does not let the platform write to an aircraft.
      VISION_ONBOARDING_PROBE_ENABLED: "true"
      # vision.onboarding.passport.enabled -- captures a VehicleProfile snapshot at
      # PREFLIGHT and POSTFLIGHT. Inert without probe.enabled, which is why the two
      # flip together; the app logs a startup WARNING naming both if they disagree.
      VISION_ONBOARDING_PASSPORT_ENABLED: "true"
      # vision.geo.fixed-camera.enabled -- projects a calibrated fixed camera's
      # tracked objects onto the tactical map (~1 Hz). Off, every camera-pose and
      # map-tracks endpoint answers 409 naming the flag.
      VISION_GEO_FIXED_CAMERA_ENABLED: "true"
      # vision.training.enabled -- the capture -> label -> train -> promote loop.
      # Off, /api/datasets and the sample/training routes 404 like unmapped ones.
      VISION_TRAINING_ENABLED: "true"
      # vision.simulation.enabled -- the zero-hardware Playground (docs/plans/active/
      # LINK-PAIRING-PLAN.md §4 row L2). Off, POST /api/simulations 404s and the
      # simulated video/telemetry discovery producers are entirely absent.
      VISION_SIMULATION_ENABLED: "true"

      # The three below are judgment calls the owner took explicitly, not safe
      # defaults. Each is flagged here so a future reader knows it was a decision.
      #
      # vision.api.rate-limit.enabled -- per-principal token buckets. Its own config
      # comment says to enable it *together with auth*, never alone: buckets key on
      # the acting principal, and with auth off that is one shared dev principal for
      # the whole deployment. Auth is on above, so the precondition holds.
      VISION_API_RATE_LIMIT_ENABLED: "true"
      # vision.geo.visual.enabled -- visual geolocation. Ships off by design ("off
      # means invisible"); it opens a gRPC geo session per flying asset with a
      # resolvable stream and pulls keyframes from mediamtx, so it is the one flag
      # here with a real steady-state cost. Watch cv-service load after a redeploy.
      VISION_GEO_VISUAL_ENABLED: "true"
      # vision.onboarding.remediate.message-interval.enabled -- the single
      # deliberate exception to "nothing automatic from discovery": it asks a
      # vehicle for more message types than a fresh link carries. This TRANSMITS to
      # the aircraft (session-scoped, nothing persisted, a reboot forgets it), which
      # is why it is a separate flag from probe.enabled.
      VISION_ONBOARDING_REMEDIATE_MESSAGE_INTERVAL_ENABLED: "true"

      # --- Always-on telemetry (ALWAYS-ON-FLOW-PLAN.md wave A) ---
      # vision.telemetry.always-on.enabled -- claims every in-service asset's telemetry
      # continuously, so a link is live because the aircraft exists rather than
      # because somebody has a browser tab open on it.
      #
      # Without this, stopping a stream stops telemetry -- and far more often, the
      # idle-stream reaper (vision.streams.idle.*, ON by default and overridden
      # nowhere) stops a stream nobody has watched for ten minutes, closes its usage
      # and tears the MAVLink subscription down with it. On a deployment this is
      # never what is wanted: the aircraft is still flying whether or not anyone is
      # looking at its video.
      #
      # Cost is one telemetry subscription per TELEMETRY-capable device of an
      # in-service asset. The UDP socket layer is shared and already always-on (the
      # discovery lobby holds :14550 at boot), so this adds claims, not sockets.
      # It opens no AssetUsage, so it writes no telemetry rows on its own.
      VISION_TELEMETRY_ALWAYS_ON_ENABLED: "true"

      # --- Durable platform-event history (ALWAYS-ON-FLOW-PLAN.md wave B3) ---
      # vision.events.history.enabled -- records every platform Event except DETECTION to Postgres,
      # off the hot path, so the notification bell and /manage/system have a real history behind them
      # instead of an in-memory log that starts empty on every page load and loses everything on an
      # SSE reconnect. GET /api/system/events serves it back. See application.yaml's own comment
      # block for the retention cap (vision.events.history.retention.max-rows, default 20000).
      VISION_EVENTS_HISTORY_ENABLED: "true"
    ports:
      - "8080:8080" # REST + web console + WebSocket (/ws/manual-control) + the HLS proxy
      # MAVLink telemetry AND commands, both directions, on this ONE UDP port. A
      # `mavlink` device's `udp://0.0.0.0:14550` URI means BIND, not dial-out: the
      # vehicle (SITL, an ELRS backpack, a companion Pi's mavlink-router, an ESP32
      # bridge -- see infra/edge/*.md, every recipe there says 14550) pushes to us,
      # and MavlinkGateway sends RC_CHANNELS_OVERRIDE / COMMAND_LONG back out of the
      # same socket to the source address it learned from that vehicle's HEARTBEAT.
      # Without this publish the container never hears a vehicle at all, so nothing
      # downstream of it -- telemetry, manual control, arming -- can work: `docker
      # compose up` was reachable only over TCP 8080 until this line existed.
      # Second and later vehicles: add "14551:14551/udp" etc., the port-per-vehicle
      # convention infra/sitl/README.md already uses for multi-instance SITL.
      - "14550:14550/udp"
    # Known limitation of publishing ports on a bridge network rather than
    # `network_mode: host`: ONVIF/WS-Discovery and mDNS are MULTICAST, and multicast
    # does not cross the bridge, so adapter-discovery finds nothing under compose
    # even though V4L2 scanning and manual device registration are unaffected.
    # `network_mode: host` would fix discovery but costs this file the compose DNS
    # names (`postgres`, `mediamtx` would have to become localhost), collapses the
    # deliberate 18888/18889/19996/19997 host remapping, and is Linux-only -- so it
    # is not the default. Video ingest needs NO inbound port either way: RTSP/MJPEG
    # sources are dialled OUT to (the ESP32-CAM case included).
    healthcheck:
      # docs/plans/done/SYSTEM-STATUS-PLAN.md §4.4: liveness probe against the actuator health
      # endpoint added there (management.endpoints.web.exposure.include: health, application.yaml) --
      # only `health` is ever exposed, permitted in SecurityConfig regardless of
      # VISION_AUTH_ENABLED. No curl/wget in this image (eclipse-temurin:21-jre, unlike cv-service's
      # own Python image, ships neither) -- bash's own /dev/tcp pseudo-device is enough for a plain
      # HTTP/1.1 GET and IS present (bash is Debian/Ubuntu "Essential: yes", unlike curl/wget).
      # CMD (not CMD-SHELL) with an explicit `bash -c` argv, not the joined-string form, so this
      # doesn't depend on /bin/sh (dash on Debian/Ubuntu) understanding /dev/tcp -- it doesn't.
      # `grep -qw UP` (word-bounded, not `"status":"UP"`) avoids embedding a literal `"` in this
      # already twice-quoted (YAML, then bash) string; Spring Boot's default {"status":"UP"} health
      # body has no other bare UP token to false-positive against.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -qw UP <&3"
      interval: 10s
      timeout: 5s
      retries: 6
      # Spring context startup (Flyway migration + JVM warmup) can take a few seconds on a cold
      # container -- generous enough for that even on a slow machine, same rationale as cv-service's
      # own start_period just above.
      start_period: 30s
    volumes:
      # scripts/demo.sh's clip arguments must be paths the vision-app *process*
      # can read. In compose mode that's this container's filesystem, not the
      # host's -- mount your clips directory here and pass the container-side
      # path (e.g. /clips/my-clip.mp4) to demo.sh. Defaults to a sibling
      # ./clips/ directory (create it, or point DEMO_CLIPS_DIR elsewhere); one
      # line, always on, since an absent host directory just mounts empty and
      # costs nothing.
      - ${DEMO_CLIPS_DIR:-./clips}:/clips:ro

  # --- Serial carrier hardware passthrough variant (LINK-PAIRING-PLAN.md §3.2/§7, opt-in) ---
  #
  # Same build/environment/ports/healthcheck/volumes as vision-app above, via the
  # &vision-app-base YAML anchor (identical technique to x-cv-service-build/x-cv-service-healthcheck
  # at the top of this file) -- differing only by the /dev/serial/by-id device passthrough
  # drone-link/carrier-serial's SerialCarrierConfiguration needs to see ArduPilot/PX4 ground-radio
  # and bench-cable serial ports from inside the container. vision.carrier.serial.enabled still
  # defaults to false (application.yaml) even with the device present -- this only makes the
  # hardware reachable, it does not turn the poller on.
  #
  # Compose profiles gate a whole service, never a single field of an always-on one -- there is no
  # way to attach this device to vision-app itself "only under a profile", so this is a second,
  # explicitly opt-in service instead, gated behind the "serial" profile exactly like cv-split/scale
  # above. vision-app (no profile) still always starts on a plain `docker compose up`, so bringing
  # this up ALONGSIDE it would start two containers racing for the same 8080/14550 host ports --
  # same reason cv-service-inference/cv-service-training's own comment documents `--scale
  # cv-service=0`. Run serial mode with:
  #
  #   docker compose up -d --scale vision-app=0 --profile serial vision-app-serial
  #
  # Most hosts running this compose have no /dev/serial/by-id at all, which is exactly why this
  # stays a second named service rather than a live edit to vision-app's own device list: an
  # unconditional `devices:` entry naming a path that does not exist on the host would fail
  # `docker compose up` outright for everyone else.
  vision-app-serial:
    <<: *vision-app-base
    profiles: ["serial"]
    devices:
      - /dev/serial/by-id:/dev/serial/by-id

volumes:
  postgres-data:
  # docs/plans/done/OPS-CORE-PLAN.md §R: mediamtx's recorded fMP4 segments (72h
  # retention, MTX_PATHDEFAULTS_RECORDDELETEAFTER above). Docker-managed, not
  # a bind mount -- see the mediamtx service's own volumes: comment.
  mediamtx-recordings:
