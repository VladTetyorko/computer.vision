# Mounted into the mediamtx service by docker-compose.yml (/mediamtx.yml -- that image's own
# `mediamtx.yml`-in-cwd default lookup, and its own scratch-image cwd is "/", already established by
# this repo's docker-compose.yml comments for the recording-path setting). This file replaces
# mediamtx's baked-in default config wholesale, so every key it doesn't mention keeps mediamtx's own
# normal default value -- confirmed by wave M0's spike (cv/cv-service/spikes/pull/results/
# mediamtx-spike.yml, whose own transcript describes it as "the DEFAULT baked-in config with two
# deliberate overrides": read that file for the measurement, this one is the deploy artifact derived
# from it, not a copy of scratch space). docker-compose.yml's own MTX_* environment variables still
# apply as overrides on top of whatever this file sets, exactly as they already do against mediamtx's
# un-mounted baked-in config today.
#
# docs/plans/done/MEDIA-SOT-PLAN.md §5.3, blocking correction: mediamtx's Control API is IP-gated by
# its own baked-in `authInternalUsers` -- the "any" user's `ips` list grants unauthenticated `api`
# access only to a caller at 127.0.0.1/::1. A docker-published port does not preserve that view (the
# container sees the compose bridge's gateway IP, not loopback), so vision-app calling from a sibling
# container 401s on every Control API call. Setting MTX_API alone does not widen this, and
# MTX_AUTHINTERNALUSERS as an env override was tried and does not work (mediamtx's env-var loader has
# no list-of-struct override for this field) -- mounting this file is the actual fix.
#
# `ips: []` means "no IP restriction" (verified against bluenviron/mediamtx:1.19.3 by wave M0's curl
# transcript, cv/cv-service/spikes/pull/results/mediamtx_api_transcript.txt). Widening it this far is
# safe ONLY because docker-compose.yml's own host publish for this port is loopback-only
# (`127.0.0.1:19997:9997` -- see that port's own comment in docker-compose.yml for the full
# incident writeup), which leaves exactly two ways to reach this "any" user's widened api
# permission: (a) another container on this same compose network (vision-app, trusted -- the whole
# reason M7 needed this widening in the first place), or (b) a process on the Docker host itself via
# loopback (equally trusted -- it's the same machine running the stack). Neither is "any caller on
# the LAN or the internet".
#
# An earlier revision of this comment claimed "mediamtx is never directly exposed past the compose
# network's own port mappings" -- that was WRONG, not just imprecise: docker-compose.yml originally
# published this port as `19997:9997`, binding all host interfaces, which IS an exposure path past
# the compose network. Until that binding was corrected to loopback-only, `ips: []` here genuinely
# did mean "any caller who can reach this host on 19997, full stop" -- unauthenticated path
# create/repoint/delete for anyone on the LAN, or the internet if the host was exposed (this stack
# is deployed on field servers as a drone command point, per CLAUDE.md's deployment section). The
# mistake is kept documented here, not silently rewritten, so nobody re-derives the same wrong
# assumption from a stale copy of this file or an old comment.
#
# docs/plans/active/ASSET-FLOWS-PLAN.md §2 "S6 auth model" -- read+publish are now gated. Before this
# change, `any` (below) had blanket publish/read/playback with no restriction: anyone on the network
# who could reach mediamtx's RTSP/HLS/WHEP ports could inject video into any path or pull any stream
# (a real defect, not a hypothetical one -- this stack is a field-deployed drone command point per
# CLAUDE.md's deployment section, so "anyone on the network" is not a trusted set). Three accounts now
# replace the single wide-open `any` entry:
#   - `any` (unauthenticated): publish narrowed to the `ingest/` prefix ONLY (anchored regex --
#     see the note on `path:` below), plus api/metrics/pprof unchanged (see that section's own
#     comment for why those stay open). No read/playback permission at all: an unauthenticated
#     client can no longer watch any stream.
#   - `vision-viewer`: read + playback on every path, no path restriction. This is the ONE account
#     used by HLS/WHEP playback and by external players -- vision-api's HlsProxyController injects
#     it as an outbound Basic-auth header for proxied HLS, and MediamtxStreamPublisher/
#     MediamtxProxyPublisher embed it as `?user=&pass=` query parameters in the WHEP/playback URLs
#     handed to a browser verbatim (mediamtx's own documented mechanism for HTTP-based protocols a
#     browser client drives directly -- see video-output/publish-hls's MediamtxUrls class javadoc).
#   - `vision-publisher`: publish on every path (no `path:` restriction, so it also covers `ingest/`,
#     harmlessly -- nothing needs it there since `any` already covers that prefix unauthenticated).
#     Used by MediamtxStreamPublisher's RTSP push (embedded in the RTSP URL's userinfo, e.g.
#     `rtsp://vision-publisher:***@mediamtx:8554/...`) and by MediamtxProxyPublisher's mediamtx-dials-
#     the-camera paths (D3) -- the latter never sends credentials of its own since mediamtx is the
#     one publishing there, not this JVM.
#
# `ingest/` staying open-publish is DELIBERATE, not an oversight: it is the zero-config device-push
# funnel (see the `paths:` section below) -- a camera/companion with no vision-side account can push
# straight into an `ingest/*` path, and MediamtxPathScanner (device-discovery, off-limits to this
# correction) quarantines it as a "found device" candidate until an operator explicitly accepts it.
# Requiring a credential here would break zero-config onboarding for every device that can't be
# taught one; the quarantine step is the actual safeguard, not a closed publish port. A malicious
# publisher can still spam `ingest/*` paths with junk video -- accepted risk, unchanged by this
# correction, bounded by the operator-accept gate downstream.
#
# `path:` on a permission entry is a PLAIN LITERAL STRING unless prefixed with a leading tilde
# (`~`), which switches it to a Go regexp checked with an unanchored `regexp.MatchString` --
# straight from mediamtx's own baked-in default config comment ("Regular expressions can be used
# by using a tilde as prefix"), confirmed empirically: a bare `^ingest/.*` (no tilde) matched
# NOTHING -- every push to an actual `ingest/<id>` path was rejected, because mediamtx was
# comparing the path name against the nine literal characters `^ingest/.*`, not running it as a
# pattern -- caught by video-output/publish-hls's MediamtxDockerIntegrationTest, which pushes to a
# real `ingest/`-prefixed path against a real mediamtx container. An earlier revision of this
# comment claimed the opposite (unanchored substring matching with no tilde needed) -- that was
# WRONG; the value below carries BOTH the tilde (regex mode) AND the leading `^` (anchor to the
# start of the path name, so e.g. `evilingest/foo`/`not-ingest/x` -- the substring "ingest/"
# appearing mid-string -- correctly do NOT match).
#
# CRITICAL -- mediamtx's env-var loader (`MTX_*`) has NO override mechanism for list-of-struct
# fields like `authInternalUsers` (see the api/apiAddress note above, which hit this same limit
# first) -- there is no `MTX_AUTHINTERNALUSERS` that can change `vision-viewer`/`vision-publisher`'s
# passwords at deploy time. The plaintext `pass:` values below and docker-compose.yml's
# `VISION_MEDIA_AUTH_VIEWER_PASSWORD`/`VISION_MEDIA_AUTH_PUBLISHER_PASSWORD` env vars (consumed by
# vision-app as `vision.media.auth.*`, which is what the Java side actually sends) are therefore TWO
# INDEPENDENT sources of truth for the same secret, kept in sync ONLY by whoever edits both files by
# hand. Changing one without the other breaks auth (mediamtx rejects credentials the Java side is no
# longer sending, or vice versa) -- there is no way around this short of templating this file at
# deploy time, which is out of this correction's scope. Operators MUST override the `change-me`
# defaults below AND the matching docker-compose.yml env vars together, in the same change.
#
# publish/read/playback are restated alongside api/metrics/pprof (on the accounts that keep them) so
# this file doesn't accidentally NARROW anything mediamtx already grants beyond what this correction
# intends to change -- widening api access (pre-existing, see below) and gating read/publish
# (this correction) are the only actual behaviour changes from mediamtx's own baked-in config.
api: yes
apiAddress: :9997
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path: ~^ingest/.*
      - action: api
      - action: metrics
      - action: pprof
  - user: vision-viewer
    pass: change-me
    ips: []
    permissions:
      - action: read
      - action: playback
  - user: vision-publisher
    pass: change-me
    ips: []
    permissions:
      - action: publish

# Preserves mediamtx's own default per-path behaviour: any path name (a per-start random StreamId,
# docs/plans/done/MEDIA-SOT-PLAN.md D2) is accepted with no explicit per-path configuration block --
# exactly what the plain RTSP push path already relies on today, and what MediamtxProxyPublisher's
# dynamically created paths (POST /v3/config/paths/add/{streamId}) need too.
#
# The SAME all_others catch-all is also the "inbox" push convention for zero-config device
# onboarding (docs/plans/active/ZERO-CONFIG-ONBOARDING-CONTEXT.md §3 P3, §11 "Z3 amendment
# (2026-08-31) -- poll, not hook"): a camera/companion that can push RTSP (or, later, WHIP/SRT)
# publishes to rtsp://<this-host>:8554/ingest/<kind>-<id> -- e.g. ingest/rover-a1b2c3 -- with no
# path pre-declared here, no credentials, and no operator action on vision's side. The ingest/
# prefix is not a mediamtx concept (this file grants every path under all_others identically); it
# is the convention MediamtxPathScanner (device-discovery/onvif-mdns-v4l2, adapter-discovery)
# reads back out: each discovery-inbox sweep polls GET /v3/paths/list on the Control API above and
# reports every READY path whose name starts with ingest/ as a "found device" candidate, while
# every path OUTSIDE that prefix -- including the per-stream paths MediamtxStreamPublisher itself
# creates when this app republishes a decoded/detected stream for HLS/WHEP viewing (MEDIA-SOT) --
# is silently skipped, so vision never discovers its own video output as if it were a new camera.
# Once an ingest/ candidate is registered as a Device, its stream address is this mediamtx path's
# own RTSP URL, not the pushing device's address -- vision's ordinary RTSP pull path
# (video-input/rtsp) then treats mediamtx itself as "the camera", unchanged from any other source.
paths:
  all_others:
