name: CI

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B verify

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protobuf/gRPC codegen tooling
        run: pip install grpcio-tools protobuf

      - name: Generate protobuf/gRPC stubs
        run: bash cv/cv-service/scripts/gen_proto.sh

      - name: Compile-check cv_service sources
        run: python -m compileall cv/cv-service/cv_service
